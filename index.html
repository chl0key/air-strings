<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Strings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  /* ── Colors ──────────────────────────────────────────────
     Every color lives here, so the look can change in one place.
     Theme: a practice room late at night, lit by one warm lamp. */
  :root {
    --room:   #1b1524;   /* background: deep plum */
    --wall:   #2a2236;   /* panels */
    --bone:   #ece4d6;   /* main text */
    --dust:   #a89cb8;   /* quiet text, hand bones */
    --lamp:   #f2a541;   /* hand 1: warm amber */
    --ember:  #e4572e;   /* hand 2: coral red */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--room);
    color: var(--bone);
    font-family: 'Bricolage Grotesque', sans-serif;
    overflow: hidden;
  }

  /* The stage fills the window. The camera picture is drawn onto it. */
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* The raw <video> is hidden. We only use it as a source of frames. */
  video { display: none; }

  /* Start screen */
  #start {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 max(16px, 8vw);
    gap: 20px;
  }
  #start h1 { margin: 0; font-size: clamp(48px, 9vw, 112px); font-weight: 800; line-height: 0.95; letter-spacing: -0.02em; }
  #start p  { margin: 0; max-width: 34em; font-size: 18px; line-height: 1.5; color: var(--dust); }
  #start button {
    align-self: flex-start;
    font: inherit; font-size: 18px; font-weight: 600;
    color: var(--room); background: var(--lamp);
    border: 0; border-radius: 999px; padding: 14px 28px; cursor: pointer;
  }
  #start button:disabled { opacity: 0.6; cursor: wait; }
  #start .buttons { display: flex; flex-wrap: wrap; gap: 12px; }
  #start button.quiet { background: transparent; color: var(--bone); box-shadow: inset 0 0 0 2px var(--dust); }
  #status { min-height: 1.5em; color: var(--lamp); font-size: 16px; }
  .hidden { display: none !important; }

  /* Panel in the corner: what the tracker sees, and the pinch controls */
  #panel {
    position: fixed; left: 16px; bottom: 16px;
    width: min(320px, calc(100vw - 32px));
    font-size: 14px; color: var(--dust);
    background: color-mix(in srgb, var(--wall) 88%, transparent);
    padding: 12px 14px; border-radius: 10px;
    display: grid; gap: 10px;
  }
  #panel .row { display: grid; grid-template-columns: 56px 1fr 44px; align-items: center; gap: 8px; }
  #panel .name { color: var(--bone); font-weight: 600; }
  #panel .num  { text-align: right; font-variant-numeric: tabular-nums; }

  /* A meter: the bar shows how wide open the pinch is */
  .meter { position: relative; height: 10px; border-radius: 5px; background: var(--room); overflow: hidden; }
  .meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 5px; }
  .meter .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bone); opacity: 0.7; }

  #panel label { display: grid; grid-template-columns: 1fr 44px; gap: 4px 8px; align-items: center; }
  #panel label span:first-child { grid-column: 1 / -1; }
  #panel input[type=range] { width: 100%; accent-color: var(--lamp); }
</style>
</head>
<body>

<video id="cam" playsinline muted></video>
<canvas id="stage"></canvas>

<section id="start">
  <h1>Air Strings</h1>
  <p>Stage 3: sweep your index fingertip across the string to play it. Sound on. The faster you sweep, the louder it plays.</p>
  <div class="buttons">
    <button id="go">Turn on camera</button>
    <button id="mouse" class="quiet">Use the mouse instead</button>
  </div>
  <div id="status"></div>
</section>

<div id="panel" class="hidden">
  <div id="fps">Hands: 0</div>
  <div class="row"><span class="name">Hand 1</span><div class="meter" id="m0"><div class="fill"></div><div class="mark close"></div><div class="mark open"></div></div><span class="num" id="n0">-</span></div>
  <div class="row"><span class="name">Hand 2</span><div class="meter" id="m1"><div class="fill"></div><div class="mark close"></div><div class="mark open"></div></div><span class="num" id="n1">-</span></div>
  <label><span>Pinch closes below</span><input type="range" id="closeAt" min="0.10" max="0.60" step="0.01"><span class="num" id="closeVal"></span></label>
  <label><span>Pinch opens above</span><input type="range" id="openAt" min="0.15" max="0.80" step="0.01"><span class="num" id="openVal"></span></label>
</div>

<script type="module">
// ════════════════════════════════════════════════════════════
//  AIR STRINGS · Stage 3: one string, one sound
// ════════════════════════════════════════════════════════════
//
//  New in this stage:
//    • Sound, made by the browser's built-in sound engine (section 13)
//    • One fixed string across the screen (section 14)
//    • Pluck detection: a fingertip crossing the string plays it (section 15)
//    • The mouse can play too, so you can test without the camera (section 16)
//
//  From Stage 2:
//    • Each hand keeps its own slot (section 7), smoothing (section 8)
//    • Pinch detection (section 9)

// ── 1. Where the hand tracker comes from ─────────────────────
const MEDIAPIPE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

// ── 2. The 21 points on a hand ───────────────────────────────
//    0 = wrist
//    1-4   = thumb    (4 is the thumb tip)
//    5-8   = index    (5 is the knuckle, 8 is the tip)
//    9-12  = middle   (9 is the knuckle, 12 is the tip)
//    13-16 = ring     (16 is the tip)
//    17-20 = pinky    (20 is the tip)
const WRIST = 0, THUMB_TIP = 4, INDEX_KNUCKLE = 5, INDEX_TIP = 8, MIDDLE_KNUCKLE = 9, PINKY_KNUCKLE = 17;
// On a flat, facing hand the palm is about 1.4 times as long as it is wide
const PALM_WIDTH_SCALE = 1.4;
const FINGERTIPS = [4, 8, 12, 16, 20];

const BONES = [
  [0, 1], [1, 2], [2, 3], [3, 4],          // thumb
  [0, 5], [5, 6], [6, 7], [7, 8],          // index
  [5, 9], [9, 10], [10, 11], [11, 12],     // middle
  [9, 13], [13, 14], [14, 15], [15, 16],   // ring
  [13, 17], [17, 18], [18, 19], [19, 20],  // pinky
  [0, 17],                                 // across the palm
];

// ── 3. Settings you can tune ─────────────────────────────────
const settings = {
  // A real pinch reads about 0.10-0.17. A relaxed hand, thumb resting
  // beside the index finger, reads about 0.34. These sit in between.
  closeAt: 0.22,     // the pinch closes when the ratio is smaller than this
  openAt:  0.32,     // it opens again when the ratio is bigger than this
  holdFrames: 2,     // a change must last this many frames in a row to count
  smoothing: 0.5,    // 0 = frozen, 1 = no smoothing at all
};

// ── 4. Grab the page elements we need ────────────────────────
const $ = id => document.getElementById(id);
const video = $('cam'), canvas = $('stage'), ctx = canvas.getContext('2d');

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const COLORS = { room: css('--room'), bone: css('--bone'), dust: css('--dust'), hands: [css('--lamp'), css('--ember')] };

let tracker = null;
let lastVideoTime = -1;

// Two slots, one per hand. A slot is empty (null) when that hand isn't in view.
const slots = [null, null];

// Small helpers
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
const mid  = (p, q) => ({ x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 });
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ── 5. Keep the canvas the same size as the window ───────────
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

// ── 6. Start: camera first, then the tracker ─────────────────
$('go').addEventListener('click', async () => {
  $('go').disabled = true;
  startAudio();   // browsers only allow sound to start from a click, so we start it here
  try {
    $('status').textContent = 'Waiting for camera permission…';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();

    $('status').textContent = 'Loading the hand tracker…';
    tracker = await loadTracker();

    $('start').classList.add('hidden');
    $('panel').classList.remove('hidden');
  } catch (err) {
    console.error(err);
    $('status').textContent = err.name === 'NotAllowedError'
      ? 'The camera was blocked. Allow it in the address bar, then try again.'
      : 'Something went wrong: ' + err.message;
    $('go').disabled = false;
  }
});

async function loadTracker() {
  const vision = await import(MEDIAPIPE + '/vision_bundle.mjs');
  const files = await vision.FilesetResolver.forVisionTasks(MEDIAPIPE + '/wasm');
  const options = delegate => ({
    baseOptions: { modelAssetPath: HAND_MODEL, delegate },
    runningMode: 'VIDEO',
    numHands: 2,
  });
  try {
    return await vision.HandLandmarker.createFromOptions(files, options('GPU'));
  } catch (e) {
    console.warn('GPU not available, using CPU', e);
    return await vision.HandLandmarker.createFromOptions(files, options('CPU'));
  }
}

function videoFit() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(innerWidth / vw, innerHeight / vh);
  return { vw, vh, scale, ox: (innerWidth - vw * scale) / 2, oy: (innerHeight - vh * scale) / 2 };
}

// Fraction of the camera picture → mirrored position on screen
function toScreen(p, fit) {
  return {
    x: innerWidth - (p.x * fit.vw * fit.scale + fit.ox),
    y: p.y * fit.vh * fit.scale + fit.oy,
  };
}

// ── 7. Keep each hand in its own slot ────────────────────────
// MediaPipe lists the hands it finds, but the order can change from one
// frame to the next. That's what made the colors swap in Stage 1.
//
// The fix: remember where each hand's wrist was last frame. Each new hand
// goes to the slot whose wrist was closest. A hand with no close match
// takes an empty slot. A slot that goes unmatched for a moment is cleared.
const MAX_JUMP = 300;     // pixels: further than this, it's not the same hand
const LOST_AFTER = 0.25;  // seconds: how long a hand can vanish before its slot clears

function assignHands(found, now) {
  const used = new Set();
  const matched = [null, null];

  // Every possible pairing of (new hand, slot), closest first
  const pairs = [];
  found.forEach((pts, i) => slots.forEach((slot, j) => {
    if (slot) pairs.push({ i, j, d: dist(pts[WRIST], slot.pts[WRIST]) });
  }));
  pairs.sort((a, b) => a.d - b.d);

  for (const { i, j, d } of pairs) {
    if (used.has(i) || matched[j] || d > MAX_JUMP) continue;
    matched[j] = found[i];
    used.add(i);
  }

  // Hands with no match go into an empty slot, if there is one
  found.forEach((pts, i) => {
    if (used.has(i)) return;
    const empty = [0, 1].find(j => !slots[j] && !matched[j]);
    if (empty === undefined) return;
    slots[empty] = newHand(pts);
    matched[empty] = pts;
    used.add(i);
  });

  // Update matched slots. Clear the ones that have been missing too long.
  for (let j = 0; j < 2; j++) {
    if (matched[j]) updateHand(slots[j], matched[j], now);
    else if (slots[j] && now - slots[j].seen > LOST_AFTER) slots[j] = null;
  }
}

function newHand(pts) {
  return {
    pts: pts.map(p => ({ ...p })),   // smoothed points
    seen: 0,                         // when we last saw it
    ratio: 1,                        // pinch gap ÷ hand size
    pinched: false,                  // is the pinch closed right now?
    streak: 0,                       // frames in a row that disagree with "pinched"
    at: { x: 0, y: 0 },              // the pinch point: halfway between thumb and index tips
    flash: 0,                        // when the pinch last changed, for the burst animation
  };
}

// ── 8. Smoothing ─────────────────────────────────────────────
// The tracker's points wobble by a few pixels every frame, even when your
// hand is still. Moving each point only part of the way to its new spot
// calms the wobble. The cost is a little lag.
function updateHand(h, pts, now) {
  const k = settings.smoothing;
  for (let i = 0; i < 21; i++) {
    h.pts[i].x += k * (pts[i].x - h.pts[i].x);
    h.pts[i].y += k * (pts[i].y - h.pts[i].y);
  }
  h.seen = now;
  updatePinch(h);
}

// ── 9. Pinch detection ───────────────────────────────────────
// The gap between thumb tip and index tip, in pixels, changes as you move
// closer to the camera or further away. So we divide it by the size of the
// hand. That ratio stays about the same at any distance, so the same
// settings work whether you lean in or sit back.
//
// Hand size is the bigger of two measures of the palm: its length (wrist
// to middle knuckle) and its width (index knuckle to pinky knuckle, scaled
// up to match). Tilt your palm forward and the length looks shorter to the
// camera. Turn it sideways and the width does. They rarely both shrink at once.
//
// Two thresholds, not one: the pinch closes below closeAt and only opens
// again above openAt. In between, nothing changes. With a single threshold,
// a gap that hovers right on the line would flicker on and off.
//
// And a change has to last holdFrames frames in a row, to ignore a
// one-frame glitch from the tracker.
function updatePinch(h) {
  const p = h.pts;
  const palmLength = dist(p[WRIST], p[MIDDLE_KNUCKLE]);
  const palmWidth = dist(p[INDEX_KNUCKLE], p[PINKY_KNUCKLE]) * PALM_WIDTH_SCALE;
  const handSize = Math.max(palmLength, palmWidth, 1);
  h.ratio = dist(p[THUMB_TIP], p[INDEX_TIP]) / handSize;
  h.at = mid(p[THUMB_TIP], p[INDEX_TIP]);

  const wantsChange = h.pinched ? h.ratio > settings.openAt : h.ratio < settings.closeAt;
  h.streak = wantsChange ? h.streak + 1 : 0;
  if (h.streak >= settings.holdFrames) {
    h.pinched = !h.pinched;
    h.streak = 0;
    h.flash = performance.now();
  }
}

// ── 10. The loop ─────────────────────────────────────────────
let fps = 0, frames = 0, fpsClock = performance.now();

function loop() {
  requestAnimationFrame(loop);
  const now = performance.now() / 1000;

  if (tracker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = tracker.detectForVideo(video, performance.now());
    const fit = videoFit();
    assignHands(result.landmarks.map(points => points.map(p => toScreen(p, fit))), now);
    frames++;

    // Each open hand's index fingertip can pluck. A pinching hand can't,
    // so making a pinch near the string won't play it by accident.
    slots.forEach((h, j) => {
      if (h && !h.pinched) checkPluck('hand' + j, h.pts[INDEX_TIP], now);
    });
  }

  if (mouse.on) checkPluck('mouse', mouse, now);

  draw();
  updatePanel();

  const t = performance.now();
  if (t - fpsClock > 1000) {
    fps = Math.round(frames * 1000 / (t - fpsClock));
    frames = 0; fpsClock = t;
  }
}

// ── 11. Drawing ──────────────────────────────────────────────
function draw() {
  ctx.fillStyle = COLORS.room;
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  if (video.videoWidth) {
    const fit = videoFit();
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.translate(innerWidth, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, fit.ox, fit.oy, fit.vw * fit.scale, fit.vh * fit.scale);
    ctx.restore();
  }

  if (tracker || mouse.on) drawString();   // not behind the start screen

  // Both hands pinching: draw a line between the two pinch points.
  // In Stage 5 this line becomes a string you can keep.
  const [a, b] = slots;
  if (a && b && a.pinched && b.pinched) {
    ctx.strokeStyle = COLORS.bone;
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 10]);
    ctx.lineDashOffset = -performance.now() / 30;   // the dashes crawl along the line
    ctx.beginPath();
    ctx.moveTo(a.at.x, a.at.y);
    ctx.lineTo(b.at.x, b.at.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  slots.forEach((h, i) => {
    if (!h) return;
    const color = COLORS.hands[i];
    const p = h.pts;

    ctx.strokeStyle = COLORS.dust;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (const [m, n] of BONES) { ctx.moveTo(p[m].x, p[m].y); ctx.lineTo(p[n].x, p[n].y); }
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.fillStyle = COLORS.dust;
    for (const q of p) dot(q, 3);
    ctx.fillStyle = color;
    for (const k of FINGERTIPS) dot(p[k], 8);

    // The pinch point: a thin outline when open, a thick ring when closed
    ctx.strokeStyle = color;
    ctx.lineWidth = h.pinched ? 6 : 2;
    ctx.beginPath();
    ctx.arc(h.at.x, h.at.y, h.pinched ? 16 : 22, 0, Math.PI * 2);
    ctx.stroke();

    // A short burst the moment a pinch closes or opens
    const age = (performance.now() - h.flash) / 300;
    if (age < 1) {
      ctx.globalAlpha = 1 - age;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(h.at.x, h.at.y, 16 + age * 40, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  });
}

function dot(p, r) {
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.fill();
}

// ── 12. The panel: live pinch numbers and the two sliders ────
const METER_MAX = 1.2;   // the meter's right edge stands for a ratio of 1.2
const pct = v => clamp(v / METER_MAX, 0, 1) * 100 + '%';

function updatePanel() {
  $('fps').textContent = `Hands: ${slots.filter(Boolean).length} · Tracking ${fps} times a second`;
  slots.forEach((h, i) => {
    const m = $('m' + i);
    const fill = m.querySelector('.fill');
    fill.style.width = h ? pct(h.ratio) : '0';
    fill.style.background = h && h.pinched ? COLORS.hands[i] : COLORS.dust;
    m.querySelector('.close').style.left = pct(settings.closeAt);
    m.querySelector('.open').style.left = pct(settings.openAt);
    $('n' + i).textContent = h ? h.ratio.toFixed(2) : '-';
  });
}

// The sliders change the thresholds while you play, so you can tune them to your hands.
function showSettings() {
  for (const k of ['closeAt', 'openAt']) {
    $(k).value = settings[k];
    $(k.replace('At', 'Val')).textContent = settings[k].toFixed(2);
  }
}
for (const key of ['closeAt', 'openAt']) {
  $(key).addEventListener('input', () => {
    settings[key] = +$(key).value;
    // "Opens above" must stay higher than "closes below", or a pinch could never let go
    if (settings.openAt < settings.closeAt + 0.05) {
      if (key === 'closeAt') settings.openAt = settings.closeAt + 0.05;
      else settings.closeAt = settings.openAt - 0.05;
    }
    showSettings();
  });
}
showSettings();

// ── 13. Sound ────────────────────────────────────────────────
// The Web Audio API is a sound studio built into the browser. You create
// sound sources (like an oscillator, which makes a steady tone), pass them
// through effects (like a volume knob, called a "gain"), and connect the
// last one to the speakers ("destination").
//
//   oscillator ──► gain (volume shape) ──► master gain ──► speakers
//
// Everything is timed against the audio clock (audio.currentTime), which is
// far steadier than the screen's clock.
let audio = null;
let master = null;

function startAudio() {
  if (!audio) {
    audio = new AudioContext({ latencyHint: 'interactive' });   // "interactive" = lowest delay
    master = audio.createGain();
    master.gain.value = 0.6;
    master.connect(audio.destination);
  }
  if (audio.state !== 'running') audio.resume();
}

// One beep. Loudness runs from 0 to 1.
// The volume shape, called an envelope, is what makes it sound plucked:
// a very fast rise, then a fade that slows down as it goes.
function beep(loudness) {
  if (!audio) return;
  const t = audio.currentTime;

  const osc = audio.createOscillator();
  osc.type = 'triangle';           // softer than 'square', brighter than 'sine'
  osc.frequency.value = 330;       // the note E4, in vibrations per second

  const env = audio.createGain();
  env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(loudness, t + 0.005);       // up in 5 ms
  env.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);      // down over 0.8 s

  osc.connect(env);
  env.connect(master);
  osc.start(t);
  osc.stop(t + 0.85);    // the browser tidies the oscillator away after it stops
}

// ── 14. The string ───────────────────────────────────────────
// For now there's one string, fixed in place. Its ends are stored as
// fractions of the window, so it stays put when the window is resized.
// It slopes on purpose: the pluck maths has to work at any angle.
const STRING = { a: { x: 0.25, y: 0.62 }, b: { x: 0.75, y: 0.42 } };
const string = {
  a: { x: 0, y: 0 }, b: { x: 0, y: 0 },
  wobble: 0, wobbleAt: 0, plucks: 0,   // for the vibration you see after a pluck
};
function placeString() {
  string.a = { x: STRING.a.x * innerWidth, y: STRING.a.y * innerHeight };
  string.b = { x: STRING.b.x * innerWidth, y: STRING.b.y * innerHeight };
}
addEventListener('resize', placeString);
placeString();

// ── 15. Pluck detection ──────────────────────────────────────
// Which side of the string is a point on? The cross product answers it.
//
// Take the string as an arrow from end a to end b, and a second arrow from
// a to the point. The cross product of the two arrows is positive when the
// point is on one side, negative on the other, and zero on the line.
// Divide it by the string's length and you also get the distance from the
// line, in pixels.
//
// A pluck is a fingertip that was on one side and is now on the other.
//
// Three guards stop false plucks:
//   • DEAD_BAND: within a few pixels of the line, a point counts as on
//     neither side. Tracker wobble can't flip it back and forth.
//   • The crossing has to happen between the two ends, not beyond them.
//   • COOLDOWN: one pointer can't pluck again straight away.
const DEAD_BAND = 6;      // pixels either side of the line
const COOLDOWN = 0.1;     // seconds between plucks from the same pointer
const FORGET_AFTER = 0.4; // seconds: a pointer unseen for longer starts fresh

const pointers = {};      // what we remember about each pointer, by name

function sideOf(p) {
  const { a, b } = string;
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  const cross = dx * (p.y - a.y) - dy * (p.x - a.x);
  return cross / len;     // + on one side, - on the other, size = distance in pixels
}

// How far along the string a point sits: 0 at end a, 1 at end b
function alongOf(p) {
  const { a, b } = string;
  const dx = b.x - a.x, dy = b.y - a.y;
  return ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy);
}

function checkPluck(id, p, now) {
  const d = sideOf(p);
  let mem = pointers[id];
  if (!mem || now - mem.seen > FORGET_AFTER) mem = pointers[id] = { side: 0, at: { ...p }, atTime: now, seen: now, lastPluck: 0 };

  // Inside the dead band: remember that we saw it, but don't change its side
  if (Math.abs(d) < DEAD_BAND) { mem.seen = now; return; }
  const side = Math.sign(d);

  if (mem.side && side !== mem.side && now - mem.lastPluck > COOLDOWN) {
    // Where did it cross? Slide along the move from the old point to the new
    // one, to the spot where the distance passed through zero.
    const dOld = sideOf(mem.at);
    const k = dOld / (dOld - d);
    const crossing = { x: mem.at.x + k * (p.x - mem.at.x), y: mem.at.y + k * (p.y - mem.at.y) };
    const u = alongOf(crossing);

    if (u >= 0 && u <= 1) {
      // Faster sweeps play louder: pixels per second, scaled into 0.25-1
      const speed = dist(p, mem.at) / Math.max(now - mem.atTime, 0.008);
      pluck(u, clamp(0.25 + speed / 3000, 0.25, 1));
      mem.lastPluck = now;
    }
  }
  mem.side = side;
  mem.at = { ...p };
  mem.atTime = now;
  mem.seen = now;
}

function pluck(u, loudness) {
  beep(loudness);
  string.wobble = 6 + 18 * loudness;
  string.wobbleAt = performance.now();
  string.wobbleU = clamp(u, 0.1, 0.9);
  string.plucks++;
}

// Draw the string. After a pluck it shakes, most at the spot you plucked,
// and the shaking dies away.
function drawString() {
  const { a, b } = string;
  const age = (performance.now() - string.wobbleAt) / 1000;
  const amp = string.wobble * Math.exp(-age * 5) * Math.cos(age * 70);

  // The direction straight out from the string, to push the wobble along
  const len = dist(a, b);
  const nx = -(b.y - a.y) / len, ny = (b.x - a.x) / len;

  ctx.strokeStyle = COLORS.bone;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const STEPS = 40;
  for (let i = 0; i <= STEPS; i++) {
    const u = i / STEPS;
    // A bend shaped like a tent, peaking where it was plucked, zero at the ends
    const w = string.wobbleU ? (u < string.wobbleU ? u / string.wobbleU : (1 - u) / (1 - string.wobbleU)) : 0;
    const x = a.x + (b.x - a.x) * u + nx * amp * w;
    const y = a.y + (b.y - a.y) * u + ny * amp * w;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();

  // The two pegs at the ends
  ctx.fillStyle = COLORS.hands[0];
  dot(a, 7);
  dot(b, 7);
}

// ── 16. The mouse plays too ──────────────────────────────────
// The mouse pointer is treated just like a fingertip, so the same pluck
// code runs for both. Handy for testing without the camera.
const mouse = { on: false, x: 0, y: 0 };

$('mouse').addEventListener('click', () => {
  startAudio();
  mouse.on = true;
  $('start').classList.add('hidden');
});
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

// For automated testing only: lets a test feed in made-up hands and pointers.
window.airStrings = { assignHands, slots, settings, checkPluck, string, mouse, sound: () => ({ audio, master }) };

loop();
</script>
