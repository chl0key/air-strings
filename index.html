<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Strings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  /* ── The flat and sharp signs ─────────────────────────────
     Bricolage Grotesque has no ♭ or ♯, and without a font that does, some
     browsers show question marks. So the page carries its own tiny font with
     just those two signs (840 bytes, cut from Noto Sans Symbols, which is free
     to share under the SIL Open Font License). "size-adjust" draws them 20%
     larger, to match the height of the letters beside them. */
  @font-face {
    font-family: 'Air Accidentals';
    src: url(data:font/woff2;base64,d09GMgABAAAAAANIABEAAAAABoAAAALsAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGhYbHhw6BmA/U1RBVC4ARBEICoFsgVgLCgABNgIkAxAEIAWEPgcgFyQYChs1BcgEHvq86v2fpAdQRuru6uEKGDEDn3avgHWT/udyoFdxQPVJUro96PrYGoM0i3rZ2NYLKC3xVGMLcX9dLgWvRgDOaIqsoYJInzkSTDCiY+eeA7FHHXT+/5/DOoFMMtHej8pprCpFz82rs6EXVOWVoJdm1ZSjzxx56bCquIppaCAnyKGC2iPdRozGJtrj5RXJq12tO1369OnCMfQYQzv39wwX087J5iRSSH95QVR06iiwVxTvuC0YWV9QWCN4lCi8K8U0WTvELK3QMzXlBVfFqqI99v0ZPaYsxqDN5VX/X96fdX/mLzkMGfH/P24Cw6QHe0njpS6KNmKGoaL9iQRVDQtWnTQXNdtFc+6mOamBqy9eTVy4VIzf4DjhVlLo1rtOE48z7lbXVaccB4mBYkjoc8LHQMJR0J1fGn1h4YUCW1puGnFZ0UOqpUe0/bZ9/kEuvmFt0waojzukREdtt2S2GzZ/YfMAZr1blGXunZX81b5vXmqZtKzXBsvcrOReWeavWYn86YQtloXLem39s6zX12W9yCrPmHwmOf3PZf/nMW4tv9oryjshcuvrrdeDh47NSP716e9FU5x2VFBMwJgtYbdop6nfr0+/b5viYLHeaVUOZbQYQYqMJ2Vr6NH9VLEJbzqjzmU3JuxAVW6pDqp/kbCCIEK4gsRVAAodOQQqNiaARiAVYMJM+6Ar6Tg7Qr0Op4aQRxEFFFITttZQQTXNsSiHqsmhiiIqqBEls03yr5ZixqCKAiz0oTM96Y1BDf+5AWRRTjUDaKSMbAxKqSaZ/uRRQC2lZFHFYPJU+iO2wcUZtGHGipUUy9DVdboaSh967V+2oAt96EMXWlAZU5vx95UdMKigEQkLjKZ/2IoNGzoDKSRPGfrEqb5UYVBMHjnzsB21kGl89IfXxwHHAopGpVrxkpkcDMqwUP4xJR8ZvRX01oyQUuIvOKVv/L8IG16lcEd8+ed8sPMOPxS7vw/L8CVvR/5TxilN2jkA) format('woff2');
    unicode-range: U+266D, U+266F;
    size-adjust: 120%;
  }

  /* ── Colors ──────────────────────────────────────────────
     Every color lives here, so the look can change in one place.
     Theme: a practice room late at night, lit by one warm lamp. */
  :root {
    --room:   #1b1524;   /* background: deep plum */
    --wall:   #2a2236;   /* panels */
    --bone:   #ece4d6;   /* main text, strings */
    --dust:   #a89cb8;   /* quiet text, hand bones */
    --lamp:   #f2a541;   /* hand 1: warm amber */
    --ember:  #e4572e;   /* hand 2: coral red */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--room);
    color: var(--bone);
    font-family: 'Bricolage Grotesque', 'Air Accidentals', sans-serif;
    overflow: hidden;
  }

  /* The stage fills the window. The camera picture is drawn onto it. */
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

  /* The raw <video> is hidden. We only use it as a source of frames. */
  video { display: none; }

  /* Start screen */
  #start {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 max(16px, 8vw);
    gap: 20px;
    background: var(--room);
  }
  #start h1 { margin: 0; font-size: clamp(48px, 9vw, 112px); font-weight: 800; line-height: 0.95; letter-spacing: -0.02em; }
  #start p  { margin: 0; max-width: 34em; font-size: 18px; line-height: 1.5; color: var(--dust); }
  button {
    font: inherit; font-size: 18px; font-weight: 600; line-height: 1.2;   /* fixed, so a ♭ can't make a button taller */
    color: var(--room); background: var(--lamp);
    border: 0; border-radius: 999px; padding: 14px 28px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  button.quiet { background: transparent; color: var(--bone); box-shadow: inset 0 0 0 2px var(--dust); }
  #start .buttons { display: flex; flex-wrap: wrap; gap: 12px; }
  #status { min-height: 1.5em; color: var(--lamp); font-size: 16px; }
  .hidden { display: none !important; }

  /* Top bar: the one button we need so far */
  #bar { position: fixed; top: 16px; right: 16px; left: 16px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; pointer-events: none; }
  #bar button { pointer-events: auto; }
  /* The Rec button: a red dot, and all red while waiting or recording */
  #recBtn { color: var(--ember); }
  #recBtn.live { background: var(--ember); color: var(--room); }
  #bar button { font-size: 15px; padding: 9px 18px; background: color-mix(in srgb, var(--wall) 88%, transparent); color: var(--bone); text-align: center; white-space: nowrap; }

  /* A short message that appears in the middle of the top edge, then fades */
  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    max-width: calc(100vw - 32px);
    background: var(--wall); color: var(--bone);
    padding: 10px 18px; border-radius: 999px; font-size: 16px;
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  /* A hand's pinch point is over this button: pinch to press it */
  #bar button.hand-hover { box-shadow: inset 0 0 0 2px var(--lamp); }

  /* Panel in the corner: what the tracker sees, and the pinch controls */
  #panel {
    position: fixed; left: 16px; bottom: 16px;
    width: min(320px, calc(100vw - 32px));
    font-size: 14px; color: var(--dust);
    background: color-mix(in srgb, var(--wall) 88%, transparent);
    padding: 12px 14px; border-radius: 10px;
    display: grid; gap: 10px;
  }
  #panel .row { display: grid; grid-template-columns: 56px 1fr 44px; align-items: center; gap: 8px; }
  #panel .name { color: var(--bone); font-weight: 600; }
  #panel .num  { text-align: right; font-variant-numeric: tabular-nums; }

  /* A meter: the bar shows how wide open the pinch is */
  .meter { position: relative; height: 10px; border-radius: 5px; background: var(--room); overflow: hidden; }
  .meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 5px; }
  .meter .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bone); opacity: 0.7; }

  #panel label { display: grid; grid-template-columns: 1fr 44px; gap: 4px 8px; align-items: center; }
  #panel label span:first-child { grid-column: 1 / -1; }
  #panel input[type=range] { width: 100%; accent-color: var(--lamp); }
</style>
</head>
<body>

<video id="cam" playsinline muted></video>
<canvas id="stage"></canvas>

<section id="start">
  <h1>Air Strings</h1>
  <p>Stage 12: press Loop at the top right and record a layer: it waits for the next bar, records what you play, then loops it. Stack up to six. Switch on Follow chords and every string fits the beat.</p>
  <div class="buttons">
    <button id="go">Turn on camera</button>
    <button id="mouse" class="quiet">Use the mouse instead</button>
  </div>
  <div id="status"></div>
</section>

<div id="bar" class="hidden">
  <button id="keyBtn" title="Choose the key for every string"></button>
  <button id="scaleBtn" title="Choose the scale for every string"></button>
  <button id="modeBtn" title="Single notes or chords"></button>
  <button id="beatBtn" title="Backing beat: pattern, parts, tempo, play and stop"></button>
  <button id="recBtn" title="Record a loop layer: starts on the next bar"></button>
  <button id="loopBtn" title="Looper: loop length, snap, follow chords, and your layers"></button>
  <button id="clear">Clear strings</button>
</div>
<div id="toast"></div>

<div id="panel" class="hidden">
  <div id="fps">Hands: 0</div>
  <div class="row"><span class="name">Hand 1</span><div class="meter" id="m0"><div class="fill"></div><div class="mark close"></div><div class="mark open"></div></div><span class="num" id="n0">-</span></div>
  <div class="row"><span class="name">Hand 2</span><div class="meter" id="m1"><div class="fill"></div><div class="mark close"></div><div class="mark open"></div></div><span class="num" id="n1">-</span></div>
  <label><span>Pinch closes below</span><input type="range" id="closeAt" min="0.10" max="0.60" step="0.01"><span class="num" id="closeVal"></span></label>
  <label><span>Pinch opens above</span><input type="range" id="openAt" min="0.15" max="0.80" step="0.01"><span class="num" id="openVal"></span></label>
</div>

<script type="module">
// ════════════════════════════════════════════════════════════
//  AIR STRINGS · Stage 12: the looper
// ════════════════════════════════════════════════════════════
//
//  New in this stage:
//    • Record what you play over the beat, in layers that loop (section 27)
//    • Snap recorded sounds to the beat, or keep your exact timing
//    • Follow chords: every string retunes to the beat's chord each bar (section 27a)
//
//  From Stage 11:
//    • Six beat patterns, five parts switched on one at a time (section 26)
//    • A look-ahead scheduler on the audio clock, so the beat never wobbles
//    • Bass and chords follow the top bar's key and scale
//
//  From Stage 10:
//    • One hand pinches empty air and drags: down darker, up thinner, sideways echo (section 25)
//    • With the mouse: hold Shift and drag
//
//  From Stage 9:
//    • Rest a fingertip on a string: held instruments sustain, drums and mallets roll (section 23)
//    • Pinch a string and pull sideways to bend the pitch; let go to snap it (section 24)
//    • Every note is now a "voice" that can be held, bent and released (section 12c)
//
//  From Stage 8:
//    • 24 instruments, all built from scratch with no recordings (sections 12b-12c)
//    • Two drum kits, one drum per zone along a string (section 12d)
//    • An Instrument section in the string menu, and each string shows its instrument
//
//  From Stage 7:
//    • Every string has its own scale, key, notes/chords and octave (section 18)
//    • A dot in the middle of each string opens its menu (sections 10, 20)
//    • Choose from the menu by pinching, or by hovering until a ring fills (section 20)
//    • Hands can press the buttons in the top bar (section 21)
//
//  From Stage 6:
//    • Karplus-Strong: a plucked-string sound built from noise (section 12b)
//    • Reverb, from a made-up room (section 12a)
//    • A limiter, so loud chords don't distort, and harder plucks sound brighter
//
//  From Stage 5:
//    • Each string is split into zones, one note per zone (section 18)
//    • Longer strings hold more notes
//    • A key and a scale for everything, plus a chords mode (sections 18-19)
//    • Chords are strummed, low to high or high to low, by sweep direction
//
//  From Stage 4:
//    • Smoothing that adapts to speed: steady when you aim, quick when
//      you swing (section 8)
//    • A pinch knows what it's aimed at: a peg, or empty air (section 10)
//    • Make strings with two hands, drag pegs, delete short strings (sections 10-11)
//    • Every string can be plucked, and pinches don't pluck by accident (section 13)
//
//  From earlier stages:
//    • Hand slots (7), pinch detection (9), sound (12)

// ── 1. Where the hand tracker comes from ─────────────────────
const MEDIAPIPE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

// ── 2. The 21 points on a hand ───────────────────────────────
//    0 = wrist
//    1-4   = thumb    (4 is the thumb tip)
//    5-8   = index    (5 is the knuckle, 8 is the tip)
//    9-12  = middle   (9 is the knuckle, 12 is the tip)
//    13-16 = ring     (16 is the tip)
//    17-20 = pinky    (17 is the knuckle, 20 is the tip)
const WRIST = 0, THUMB_TIP = 4, INDEX_KNUCKLE = 5, INDEX_TIP = 8, MIDDLE_KNUCKLE = 9, PINKY_KNUCKLE = 17;
const FINGERTIPS = [4, 8, 12, 16, 20];
const PALM_WIDTH_SCALE = 1.4;
const POINTER_OPEN = 0.5;       // pinch ratio at which the pointer is fully on the index fingertip   // a flat, facing palm is about 1.4 times as long as it is wide

const BONES = [
  [0, 1], [1, 2], [2, 3], [3, 4],          // thumb
  [0, 5], [5, 6], [6, 7], [7, 8],          // index
  [5, 9], [9, 10], [10, 11], [11, 12],     // middle
  [9, 13], [13, 14], [14, 15], [15, 16],   // ring
  [13, 17], [17, 18], [18, 19], [19, 20],  // pinky
  [0, 17],                                 // across the palm
];

// ── 3. Settings you can tune ─────────────────────────────────
const settings = {
  // Pinch: a firm pinch reads about 0.10-0.17, a relaxed hand about 0.34
  closeAt: 0.20,       // the pinch closes when the ratio drops below this
  openAt:  0.32,       // and opens again when it rises above this
  holdFrames: 3,       // a change must last this many frames in a row (about 1/20 s)
  settleTime: 0.3,     // seconds: a hand that has just come into view can't pinch yet

  // Smoothing (section 8)
  steadyCutoff: 1.2,   // how much a still hand is smoothed: lower = steadier, but laggier
  speedBoost: 0.015,   // how fast smoothing lets go as the hand speeds up

  // Strings
  grabRadius: 40,      // pixels: how close a pinch must be to a peg to grab it
  minLength: 110,      // pixels: shorter than this, a new string isn't made
  pullApart: 80,       // pixels: the two pinches must pull at least this much further apart...
  stretchTime: 0.25,   // seconds: ...and keep stretching at least this long, or nothing is made
  deleteBelow: 60,     // pixels: drag the pegs closer than this and the string is deleted
  maxStrings: 12,
  dotRadius: 28,       // pixels: how close a pinch must be to a string's middle dot
  aimMemory: 0.5,      // seconds: a pinch goes to what the fingertip pointed at this recently...
  aimReach: 90,        // pixels: ...as long as the pinch lands within this distance of it
  buttonPad: 10,       // pixels: extra catch area around top-bar buttons, for hands
  holdTime: 0.8,       // seconds: hold a fingertip still on a button, menu option or middle dot to choose it
  stillMove: 70,       // pixels: a pinch on a dot or button that moves less than this counts as a click

  // Holding and bending (Stage 9)
  holdNear: 12,        // pixels: a fingertip this close to a string can start a hold...
  holdAfter: 0.15,     // seconds: ...once it has rested there this long, moving slowly
  holdSlow: 250,       // pixels per second: faster than this, the finger is passing, not resting
  holdLeave: 26,       // pixels: a held finger that moves further away than this lets go
  rollGap: 0.085,      // seconds between hits of a roll
  bodyRadius: 18,      // pixels: how close a pinch must be to a string to grab it for a bend
  bendMax: 200,        // cents (100 = a semitone): the furthest a pull can bend the pitch
  bendPull: 140,       // pixels: pulling this far sideways gives the full bend

  // The air pad (Stage 10)
  padStart: 45,        // pixels: a one-hand pinch in free air that drags this far becomes the air pad
  padReach: 220,       // pixels of drag for an effect's full amount
  pluckPause: 0.25,    // seconds after letting go of a pinch before that hand can pluck
};

// ── 4. Page elements and small helpers ───────────────────────
const $ = id => document.getElementById(id);
const video = $('cam'), canvas = $('stage'), ctx = canvas.getContext('2d');

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const COLORS = { room: css('--room'), wall: css('--wall'), bone: css('--bone'), dust: css('--dust'), hands: [css('--lamp'), css('--ember')] };

const dist  = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
const mid   = (p, q) => ({ x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 });
const lerp  = (a, b, k) => a + (b - a) * k;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const seconds = () => performance.now() / 1000;

let tracker = null;
let lastVideoTime = -1;
let started = false;

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ── 5. Keep the canvas the same size as the window ───────────
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

// ── 6. Start: camera, or the mouse ───────────────────────────
function begin() {
  started = true;
  $('start').classList.add('hidden');
  $('bar').classList.remove('hidden');
  fixButtonWidths();
  if (!strings.length) addString({ x: innerWidth * 0.3, y: innerHeight * 0.62 }, { x: innerWidth * 0.7, y: innerHeight * 0.45 });
}

$('go').addEventListener('click', async () => {
  $('go').disabled = true;
  startAudio();   // browsers only allow sound to start from a click
  try {
    $('status').textContent = 'Waiting for camera permission…';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();

    $('status').textContent = 'Loading the hand tracker…';
    tracker = await loadTracker();
    $('panel').classList.remove('hidden');
    begin();
  } catch (err) {
    console.error(err);
    $('status').textContent = err.name === 'NotAllowedError'
      ? 'The camera was blocked. Allow it in the address bar, then try again.'
      : 'Something went wrong: ' + err.message;
    $('go').disabled = false;
  }
});

async function loadTracker() {
  const vision = await import(MEDIAPIPE + '/vision_bundle.mjs');
  const files = await vision.FilesetResolver.forVisionTasks(MEDIAPIPE + '/wasm');
  const options = delegate => ({
    baseOptions: { modelAssetPath: HAND_MODEL, delegate },
    runningMode: 'VIDEO',
    numHands: 2,
  });
  try {
    return await vision.HandLandmarker.createFromOptions(files, options('GPU'));
  } catch (e) {
    console.warn('GPU not available, using CPU', e);
    return await vision.HandLandmarker.createFromOptions(files, options('CPU'));
  }
}

function videoFit() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(innerWidth / vw, innerHeight / vh);
  return { vw, vh, scale, ox: (innerWidth - vw * scale) / 2, oy: (innerHeight - vh * scale) / 2 };
}

// Fraction of the camera picture → mirrored position on screen
function toScreen(p, fit) {
  return {
    x: innerWidth - (p.x * fit.vw * fit.scale + fit.ox),
    y: p.y * fit.vh * fit.scale + fit.oy,
  };
}

// ── 7. Keep each hand in its own slot ────────────────────────
// MediaPipe's list of hands can change order between frames. Each new
// reading goes to the slot whose wrist was closest last frame.
const MAX_JUMP = 300;     // pixels: further than this, it's not the same hand
const LOST_AFTER = 0.25;  // seconds before a vanished hand's slot clears

const slots = [null, null];

function assignHands(found, now) {
  const used = new Set();
  const matched = [null, null];

  const pairs = [];
  found.forEach((pts, i) => slots.forEach((slot, j) => {
    if (slot) pairs.push({ i, j, d: dist(pts[WRIST], slot.raw[WRIST]) });
  }));
  pairs.sort((a, b) => a.d - b.d);
  for (const { i, j, d } of pairs) {
    if (used.has(i) || matched[j] || d > MAX_JUMP) continue;
    matched[j] = found[i];
    used.add(i);
  }

  found.forEach((pts, i) => {
    if (used.has(i)) return;
    const empty = [0, 1].find(j => !slots[j] && !matched[j]);
    if (empty === undefined) return;
    slots[empty] = newHand();
    matched[empty] = pts;
    used.add(i);
  });

  for (let j = 0; j < 2; j++) {
    if (matched[j]) updateHand(j, matched[j], now);
    else if (slots[j] && now - slots[j].seen > LOST_AFTER) loseHand(j, now);
  }
}

function newHand() {
  return {
    raw: null,                 // the latest points, straight from the tracker
    pts: null,                 // the smoothed points we actually use
    filters: Array.from({ length: 21 }, () => ({ x: new Smoother(), y: new Smoother() })),
    seen: 0,
    ratio: 1, pinched: false, streak: 0, flash: 0,
    at: { x: 0, y: 0 },        // the pinch point, halfway between thumb and index tips
    cursor: { x: 0, y: 0 },    // where the hand is aiming: index tip when open, pinch point when pinched
    released: -9,              // when this hand last let go of a pinch
  };
}

function loseHand(j, now) {
  if (slots[j].pinched) pinchEnd('hand' + j, now, true);
  slots[j] = null;
}

// ── 8. Smoothing that adapts to speed ────────────────────────
// Stage 2 smoothed every point by the same amount all the time. That's a
// trade: smooth a lot and fast moves lag behind; smooth a little and a
// still hand shakes.
//
// This smoother changes its mind every frame. It measures how fast the
// point is moving. Still or slow: heavy smoothing, so a pinch point you're
// aiming holds steady. Fast: almost none, so a swing keeps up.
//
// The idea is called the "One Euro Filter" (Casiez, Roussel and Vogel, 2012).
// "Cutoff" is in vibrations per second: wobble faster than the cutoff is
// smoothed away, movement slower than it passes through.
class Smoother {
  filter(value, t) {
    if (this.t === undefined) { this.t = t; this.value = value; this.speed = 0; return value; }
    const dt = Math.max(t - this.t, 1 / 240);
    this.t = t;
    // How fast is it moving? (The speed is itself lightly smoothed.)
    const rawSpeed = (value - this.value) / dt;
    this.speed += Smoother.blend(1, dt) * (rawSpeed - this.speed);
    // Faster movement → higher cutoff → less smoothing
    const cutoff = settings.steadyCutoff + settings.speedBoost * Math.abs(this.speed);
    this.value += Smoother.blend(cutoff, dt) * (value - this.value);
    return this.value;
  }
  // How far to move toward the new value this frame, from 0 (not at all) to 1 (all the way)
  static blend(cutoff, dt) {
    const tau = 1 / (2 * Math.PI * cutoff);
    return 1 / (1 + tau / dt);
  }
}

function updateHand(j, pts, now) {
  const h = slots[j];
  h.raw = pts;
  h.pts = pts.map((p, i) => ({ x: h.filters[i].x.filter(p.x, now), y: h.filters[i].y.filter(p.y, now) }));
  h.seen = now;
  if (h.born === undefined) h.born = now;   // when this hand came into view
  updatePinch(j, h, now);
}

// ── 9. Pinch detection ───────────────────────────────────────
// Thumb-to-index gap ÷ hand size, so it works at any distance.
// Two thresholds so it can't flicker, and a change must last holdFrames.
function updatePinch(j, h, now) {
  const p = h.pts;
  const palmLength = dist(p[WRIST], p[MIDDLE_KNUCKLE]);
  const palmWidth = dist(p[INDEX_KNUCKLE], p[PINKY_KNUCKLE]) * PALM_WIDTH_SCALE;
  h.ratio = dist(p[THUMB_TIP], p[INDEX_TIP]) / Math.max(palmLength, palmWidth, 1);
  h.at = mid(p[THUMB_TIP], p[INDEX_TIP]);

  // The pointer: where this hand is aiming.
  // Open hand → the index fingertip, where you'd expect a pointing finger to be.
  // Closing into a pinch → it slides to the pinch point, where thumb and finger meet.
  // The slide is smooth, so the pointer never jumps as you pinch.
  const k = clamp((h.ratio - settings.closeAt) / (POINTER_OPEN - settings.closeAt), 0, 1);
  h.cursor = { x: lerp(h.at.x, p[INDEX_TIP].x, k), y: lerp(h.at.y, p[INDEX_TIP].y, k) };

  // A hand that has only just come into view is often misread for a few
  // frames, so it isn't allowed to start a pinch until it has settled.
  // Aim lock: while the hand is open, remember what the fingertip points at.
  // Pinching curls the index finger back toward the thumb, so the pinch
  // point lands a little short of where you aimed. A pinch soon after aiming
  // goes to the remembered target (see pinchStart).
  if (!h.pinched) {
    const tg = targetAt(h.cursor, true);
    if (tg) h.aimed = { tg, t: now };
  }

  if (!h.pinched && now - h.born < settings.settleTime) { h.streak = 0; return; }

  const wantsChange = h.pinched ? h.ratio > settings.openAt : h.ratio < settings.closeAt;
  h.streak = wantsChange ? h.streak + 1 : 0;
  if (h.streak < settings.holdFrames) return;
  h.streak = 0;
  h.pinched = !h.pinched;
  h.flash = performance.now();
  if (h.pinched) pinchStart('hand' + j, h.cursor, now, h.aimed);
  else { pinchEnd('hand' + j, now); h.released = now; }
}

// ── 10. What a pinch is aimed at ─────────────────────────────
// The moment a pinch closes, we look at what's under it and decide what
// this pinch is for. It keeps that job until it lets go.
//
//   near a peg     → 'drag': the peg follows the pinch
//   anywhere else  → 'free': on its own it does nothing yet. Two free
//                    pinches at once become 'make': a new string between them.
//
// Making a string has to be on purpose. Two hands that happen to pinch at
// the same moment and let go make nothing. The pinches have to pull apart
// by at least pullApart pixels and keep stretching for stretchTime seconds.
// Until then, the dashed line stays dim.
//
// Later stages add more targets: the middle of a string (menu), the
// string itself (bend), and empty air with one hand (effects).
//
// "who" names the pincher: 'hand0', 'hand1' or 'mouse'.
const grabs = {};          // who → { job, ... }
let preview = null;        // { a, b } while a new string is being stretched

function pointOf(who) {
  if (who === 'mouse') return { x: mouse.x, y: mouse.y };
  const h = slots[+who.slice(4)];
  // While a pinch is held, things follow the pinch point itself, so a peg
  // doesn't drift as your fingers open to let go
  return h ? (h.pinched ? h.at : h.cursor) : null;
}

// What's at point p? Checked in this order, first match wins:
//   1. an option in the open menu (while a menu is open, nothing else counts)
//   2. a top-bar button (hands only; the mouse clicks buttons directly)
//   3. a peg
//   4. a string's middle dot
function targetAt(p, byHand) {
  if (menu.open) { const item = menuItemAt(p); return item && { kind: 'item', item }; }
  const el = byHand && buttonAt(p);
  if (el) return { kind: 'button', el };
  const peg = nearestPeg(p, settings.grabRadius);
  if (peg) return { kind: 'peg', s: peg.s, end: peg.end };
  const s = nearestDot(p, settings.dotRadius);
  if (s) return { kind: 'dot', s };
  const body = nearestBody(p, settings.bodyRadius);
  if (body) return { kind: 'body', s: body.s, u: body.u };
  return null;
}

// Where a target is on screen
function targetPos(tg) {
  if (tg.kind === 'item') return { x: tg.item.x + tg.item.w / 2, y: tg.item.y + tg.item.h / 2 };
  if (tg.kind === 'button') { const r = tg.el.getBoundingClientRect(); return { x: (r.left + r.right) / 2, y: (r.top + r.bottom) / 2 }; }
  if (tg.kind === 'peg') return tg.s[tg.end];
  if (tg.kind === 'body') return { x: lerp(tg.s.a.x, tg.s.b.x, tg.u), y: lerp(tg.s.a.y, tg.s.b.y, tg.u) };
  return mid(tg.s.a, tg.s.b);
}

// A remembered target can go stale: the menu closed, or the string was deleted
function stillThere(tg) {
  if (tg.kind === 'item') return menu.open && menu.items.includes(tg.item);
  if (tg.kind === 'peg' || tg.kind === 'dot' || tg.kind === 'body') return strings.includes(tg.s);
  return true;
}

function pinchStart(who, p, now, aimed) {
  let tg = targetAt(p, who !== 'mouse');
  // Missed? Use what the fingertip was pointing at a moment ago
  if (!tg && aimed && now - aimed.t < settings.aimMemory && stillThere(aimed.tg)
      && dist(p, targetPos(aimed.tg)) < settings.aimReach) tg = aimed.tg;

  if (menu.open) {                    // a menu is open: choose from it, or close it if the pinch missed
    if (tg && tg.kind === 'item') chooseItem(tg.item);
    else closeMenu();
    grabs[who] = { job: 'used' };
    return;
  }
  // The mouse with Shift held: straight to the air pad
  if (!tg && who === 'mouse' && mouse.shift) { grabs[who] = { job: 'fx', from: { ...p } }; return; }
  if (!tg) { grabs[who] = { job: 'free', from: { ...p } }; return; }
  if (tg.kind === 'button') grabs[who] = { job: 'press', el: tg.el, from: { ...p } };   // pressed when the pinch lets go
  if (tg.kind === 'peg')    grabs[who] = { job: 'drag', s: tg.s, end: tg.end };
  if (tg.kind === 'dot')    grabs[who] = { job: 'dot', s: tg.s, from: { ...p }, t: now };  // menu opens when the pinch lets go
  if (tg.kind === 'body')   grabs[who] = { job: 'bend', s: tg.s, u: tg.u, ...startBend(tg.s, tg.u) };
}

// Runs every frame: move whatever each pinch is holding
function updateGrabs(now) {
  for (const who in grabs) {
    const g = grabs[who], p = pointOf(who);
    if (!p) continue;
    if (g.job === 'drag') g.s[g.end] = { ...p };
    if (g.job === 'bend') moveBend(g, p);
    // One hand pinching free air and dragging, while the other hand isn't pinching: the air pad
    if (g.job === 'free' && who !== 'mouse' && !grabs[who === 'hand0' ? 'hand1' : 'hand0']
        && dist(p, g.from) > settings.padStart && !menu.open) g.job = 'fx';
    if (g.job === 'fx') moveAirPad(g.from, p);
  }

  // Both hands pinching free air: they're stretching a new string
  const g0 = grabs.hand0, g1 = grabs.hand1;
  // (A hand already working the air pad switches to stretching when the other hand pinches too.)
  const canMake = g => g.job === 'free' || g.job === 'make' || g.job === 'fx';
  if (g0 && g1 && canMake(g0) && canMake(g1)) {
    if (g0.job === 'fx' || g1.job === 'fx') endAirPad();
    g0.job = g1.job = 'make';
    stretch(pointOf('hand0'), pointOf('hand1'), now, true);
  }
  // The mouse has only one "hand", so it stretches a string from where it pressed
  const gm = grabs.mouse;
  if (gm && (gm.job === 'free' || gm.job === 'make') && dist(gm.from, mouse) > 12) {
    gm.job = 'make';
    stretch(gm.from, { x: mouse.x, y: mouse.y }, now, false);
  }
}

// Track a string being stretched, and decide whether it's ready to keep.
// byHands: the pull-apart rules only apply to hands. A mouse press-and-drag
// is always on purpose, so for the mouse, length is enough.
function stretch(a, b, now, byHands) {
  const d = dist(a, b);
  if (!preview) preview = { startGap: d, startTime: now, pulled: 0 };   // first frame of this stretch
  preview.a = a;
  preview.b = b;
  preview.pulled = Math.max(preview.pulled, d - preview.startGap);
  preview.ready = d >= settings.minLength
    && (!byHands || (preview.pulled >= settings.pullApart && now - preview.startTime >= settings.stretchTime));
}

// lost = the hand left the camera's view mid-pinch, so don't act on it
function pinchEnd(who, now, lost) {
  const g = grabs[who];
  delete grabs[who];
  if (!g) return;

  if (g.job === 'make') {
    const pv = preview;
    preview = null;
    // The other hand was stretching the same string: it's done too
    for (const other in grabs) if (grabs[other].job === 'make') grabs[other].job = 'used';
    if (!pv || lost) return;
    if (pv.ready) addString(pv.a, pv.b);
    // Only explain if it looked like a real try. Hands that never pulled
    // apart were probably an accident, so say nothing.
    else if (pv.pulled >= settings.pullApart / 2) toast('Pull further apart to make a string');
  }

  if (g.job === 'drag' && strings.includes(g.s)) {
    if (dist(g.s.a, g.s.b) < settings.deleteBelow) removeString(g.s);
  }
  if (g.job === 'bend') endBend(g);
  if (g.job === 'fx') endAirPad();

  // A dot or a button only counts if the pinch stayed put: a quick, still
  // pinch-and-release, like a click
  const p = pointOf(who), still = g.from && p && dist(p, g.from) < settings.stillMove;
  if (g.job === 'dot' && still && now - g.t < 1.2 && strings.includes(g.s)) openMenu(g.s);
  if (g.job === 'press' && still && !lost) g.el.click();
}

// ── 11. The strings ──────────────────────────────────────────
// Each string is two pegs (a and b) plus what it needs to remember:
// when it was made, its wobble, and where each pointer was last time.
const strings = [];
const bursts = [];         // expanding rings, for when strings appear and vanish

function addString(a, b) {
  if (strings.length >= settings.maxStrings) { toast(`${settings.maxStrings} strings is the limit. Delete one first.`); return null; }
  const s = {
    a: { ...a }, b: { ...b }, born: seconds(), wobble: 0, wobbleAt: 0, wobbleU: 0.5, plucks: 0, mem: {},
    // Each string's own music settings. A new string starts with the top bar's.
    key: music.key, scale: music.scale, mode: music.mode, oct: 0, inst: 'guitar',
    holds: {}, dwell: {}, pull: null,   // Stage 9: fingers resting on it, and a pinch pulling it
  };
  strings.push(s);
  bursts.push({ ...mid(a, b), t: performance.now(), color: COLORS.bone });
  return s;
}

function removeString(s) {
  const i = strings.indexOf(s);
  if (i < 0) return;
  strings.splice(i, 1);
  if (menu.s === s) closeMenu();
  for (const id in s.holds) endHold(s, id);
  bursts.push({ ...mid(s.a, s.b), t: performance.now(), color: COLORS.hands[1] });
}

function nearestPeg(p, radius) {
  let best = null;
  for (const s of strings) for (const end of ['a', 'b']) {
    const d = dist(p, s[end]);
    if (d < radius && (!best || d < best.d)) best = { s, end, d };
  }
  return best;
}

$('clear').addEventListener('click', () => { [...strings].forEach(removeString); });

// ── 12. Sound ────────────────────────────────────────────────
// The whole sound path, from one note to the speakers:
//
//   note ──► tone filter ──► volume ─┬──────────────────────► master ──► limiter ──► speakers
//                                    └──► reverb send ──► reverb ──┘
//
// • The tone filter makes soft plucks darker and hard plucks brighter.
// • The reverb adds the echo of a room, so notes don't sound bone dry.
// • The limiter (a "compressor") stops loud chords from distorting.
let audio = null, master = null, reverbIn = null, limiter = null;

function startAudio() {
  if (!audio) {
    audio = new AudioContext({ latencyHint: 'interactive' });

    limiter = audio.createDynamicsCompressor();
    limiter.threshold.value = -10;   // start squashing above this level (in decibels)
    limiter.knee.value = 6;          // ease into it rather than snapping on
    limiter.ratio.value = 20;        // above the threshold, 20 dB in comes out as 1 dB
    limiter.attack.value = 0.001;    // react within a thousandth of a second
    limiter.release.value = 0.2;
    limiter.connect(audio.destination);

    master = audio.createGain();
    master.gain.value = 0.45;   // headroom: many notes ringing at once add up fast
    buildAirPad(master, limiter);   // master → air pad effects → limiter (section 25)

    const reverb = audio.createConvolver();
    reverb.buffer = makeRoom(audio, ROOM_SECONDS);
    reverbIn = audio.createGain();
    reverbIn.gain.value = REVERB_AMOUNT;
    reverbIn.connect(reverb);
    reverb.connect(master);
  }
  if (audio.state !== 'running') audio.resume();
}

// ── 12a. Reverb ──────────────────────────────────────────────
// A real room answers every sound with thousands of tiny echoes off the
// walls, packed so close they blur into one fading tail. A recording of
// that tail, for one sharp click, is called an "impulse response".
//
// We don't need a recording: random noise that fades away sounds a lot
// like one. The convolver then plays that tail after every note.
const ROOM_SECONDS = 2.2;      // how long the tail lasts
const REVERB_AMOUNT = 0.28;    // how much of each note goes to the reverb

function makeRoom(ctx, seconds) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);   // 2 channels: left and right differ, so it sounds wide
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let soft = 0;
    for (let i = 0; i < len; i++) {
      const k = i / len;
      soft += 0.3 * ((Math.random() * 2 - 1) - soft);   // soften the noise: walls swallow high sounds
      const fadeIn = Math.min(1, i / (ctx.sampleRate * 0.01));
      d[i] = soft * Math.pow(1 - k, 3) * fadeIn;
    }
  }
  return buf;
}

// ── 12b. The plucked string: Karplus-Strong ──────────────────
// In 1983, Kevin Karplus and Alex Strong found a cheap way to fake a
// plucked string, and it still sounds good.
//
// 1. Fill a short loop with random noise. That's the pluck: a burst of
//    every frequency at once, like a pick snapping off a string.
// 2. Play the loop round and round. A loop that repeats f times a second
//    is heard as a note of pitch f. So the loop's length sets the note.
// 3. Each time round, replace every sample with the average of itself and
//    its neighbour. Averaging smooths out fast wiggles first, so the high
//    sounds fade quickest. That's what a real string does: bright at the
//    start, mellow as it dies away.
// 4. Also shrink everything a little each time round, so the note fades.
//
// Each note is worked out once, saved, and replayed from then on.
// Each plucked instrument is the same loop with different settings:
//   seconds  how long each note lasts
//   ring     seconds for a note to fade to silence (1/1000 of its start)
//   bright   0-1: how bright the starting noise is
//   pickAt   0-0.5: where along the string it's plucked. Near the end = twangier
//   courses  some instruments pair or triple every string, tuned a few cents
//            apart (cents = hundredths of a semitone). That gives the shimmer
//            of an oud or a qanun.
//   bridge   the sitar's flat bridge: the string slaps against it on one side
//            of each swing. That flattens the bottom of the wave and adds its buzz.
const STRING_SOUND = { seconds: 3.0, ring: 3.2, bright: 0.55, pickAt: 0.18 };   // the guitar
const PLUCKED = {
  guitar: STRING_SOUND,
  egtr:   { seconds: 3.5, ring: 5.0, bright: 0.7,  pickAt: 0.12 },
  harp:   { seconds: 3.5, ring: 4.5, bright: 0.32, pickAt: 0.45 },
  oud:    { seconds: 2.0, ring: 1.8, bright: 0.8,  pickAt: 0.1,  courses: [-5, 5] },
  qanun:  { seconds: 2.5, ring: 2.6, bright: 0.9,  pickAt: 0.07, courses: [-6, 0, 6] },
  sitar:  { seconds: 3.5, ring: 4.0, bright: 0.95, pickAt: 0.05, bridge: 0.25 },
  bass:   { seconds: 2.5, ring: 2.8, bright: 0.25, pickAt: 0.3 },
};
const noteCache = new Map();

function stringNote(id, midi) {
  const key = id + ':' + midi;
  if (noteCache.has(key)) return noteCache.get(key);
  const sr = audio.sampleRate, P = PLUCKED[id];
  const out = new Float32Array(Math.floor(sr * P.seconds));
  const courses = P.courses || [0];
  for (const cents of courses) addPluck(out, midiToPitch(midi) * Math.pow(2, cents / 1200), P, sr);

  // Even out the volume, and fade the last 50 ms so it doesn't click
  let peak = 1e-6;
  for (const v of out) peak = Math.max(peak, Math.abs(v));
  const fade = Math.floor(sr * 0.05);
  for (let n = 0; n < out.length; n++) out[n] *= (0.8 / peak) * Math.min(1, (out.length - n) / fade);

  const buf = audio.createBuffer(1, out.length, sr);
  buf.getChannelData(0).set(out);
  if (noteCache.size > 200) noteCache.delete(noteCache.keys().next().value);   // keep memory in check
  noteCache.set(key, buf);
  return buf;
}

// One Karplus-Strong string, added into "out"
function addPluck(out, pitch, P, sr) {
  // How many samples long is one trip round the loop? Usually not a whole
  // number. The averaging step adds half a sample of delay on its own.
  const period = sr / pitch - 0.5;
  let N = Math.floor(period), frac = period - N;
  if (frac < 0.1) { N -= 1; frac += 1; }
  // The leftover fraction of a sample is made up with an "all-pass" filter,
  // which delays sound by a fraction of a sample without changing its tone.
  // Without it, high notes would be out of tune.
  const ap = (1 - frac) / (1 + frac);

  // 1. The pluck: a loop full of softened noise
  const loop = new Float32Array(N);
  let soft = 0;
  for (let i = 0; i < N; i++) { soft += P.bright * ((Math.random() * 2 - 1) - soft); loop[i] = soft; }
  // Plucking away from the middle: subtract a shifted copy of the noise.
  // This cancels the tones a real string can't make when plucked there.
  const shift = Math.max(1, Math.round(P.pickAt * N)), copy = loop.slice();
  let peak = 1e-6;
  for (let i = 0; i < N; i++) { loop[i] = copy[i] - copy[(i - shift + N) % N]; peak = Math.max(peak, Math.abs(loop[i])); }
  for (let i = 0; i < N; i++) loop[i] /= peak;

  // 4. How much to shrink per trip round the loop, so it fades over "ring" seconds
  const shrink = Math.pow(0.001, 1 / (pitch * P.ring));

  // 2 and 3. Play the loop round and round, averaging as we go
  let i = 0, prev = 0, apIn = 0, apOut = 0;
  for (let n = 0; n < out.length; n++) {
    const x = loop[i];
    out[n] += x;
    let avg = 0.5 * (x + prev);                   // average with the neighbour
    prev = x;
    // The sitar's bridge: below -bridge, the string is pressed flat against it
    if (P.bridge && avg < -P.bridge) avg = -P.bridge + (avg + P.bridge) * 0.25;
    const y = ap * avg + apIn - ap * apOut;       // the fraction-of-a-sample delay
    apIn = avg; apOut = y;
    loop[i] = y * shrink;
    if (++i === N) i = 0;
  }
}

// ── 12c. The 24 instruments ──────────────────────────────────
// Every instrument is built from a handful of simple parts:
//   • a Karplus-Strong string (above), for anything plucked
//   • oscillators: steady tones (sine, triangle, sawtooth, square)
//   • partials: several sine waves at chosen multiples of the note's pitch,
//     each fading at its own speed. A bell, a marimba and a piano differ
//     mostly in which multiples ring, how loud, and for how long.
//   • FM: one oscillator wobbling another's pitch very fast, which adds
//     bright, metallic overtones (the electric piano's bell-like attack)
//   • filtered noise, for breath, bows, hammers and drums
//   • envelopes, for the shape of the volume over time
//
// family:  which row of the menu it sits in
// shift:   octaves up or down from the string's notes, to suit the instrument
// level:   volume trim, so every instrument sounds about as loud as the others
// room:    how much reverb
// hold:    what a fingertip resting on the string does (Stage 9):
//          'sustain' keeps the note sounding, 'roll' repeats it fast, none rings out once
const INSTRUMENTS = {

  kalimba:   { name: 'Kalimba',         family: 1, sound: 'kalimba',  shift: 1,  level: 0.8,  room: 0.35 },

  bass:      { name: 'Bass',            family: 3, sound: 'pluck',    shift: -1, level: 1.0,  room: 0.1 },
  bass808:   { name: '808 bass',        family: 3, sound: 'sub',      shift: -1, level: 0.7,  room: 0.05 },
  drums:     { name: 'Drums',           family: 3, sound: 'drums',    shift: 0,  level: 1.0,  room: 0.15, hold: 'roll' },
  handdrums: { name: 'Hand drums',      family: 3, sound: 'handdrums',shift: 0,  level: 1.0,  room: 0.2, hold: 'roll' },
};
const INSTRUMENT_ORDER = Object.keys(INSTRUMENTS);

// Sustained instruments (bowed, blown, sung, organ, synth) can sound for as
// long as you like. For now each note lasts NOTE_HOLD seconds; Stage 9 lets
// you hold a note by resting your finger on the string.
const NOTE_HOLD = 0.9;

// One shared output per instrument: volume trim, then to the speakers and the reverb
const buses = {};
function busFor(id) {
  if (buses[id]) return buses[id];
  const I = INSTRUMENTS[id];
  const g = audio.createGain();
  g.gain.value = I.level;
  const send = audio.createGain();
  send.gain.value = I.room / REVERB_AMOUNT * 0.28;   // 0.28 was the guitar's amount in Stage 6
  g.connect(master);
  g.connect(send);
  send.connect(reverbIn);
  if (I.drive) {
    // The electric guitar runs through a "drive": loud sounds get rounded off,
    // which adds the gritty overtones of an amplifier pushed hard.
    const shaper = audio.createWaveShaper();
    const curve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; curve[i] = Math.tanh(3 * x); }
    shaper.curve = curve;
    shaper.oversample = '2x';
    const pre = audio.createGain();
    pre.gain.value = 1;
    pre.connect(shaper);
    shaper.connect(g);
    return (buses[id] = pre);
  }
  return (buses[id] = g);
}

// ── Small building blocks ──
// An envelope: a list of [seconds after t, value] points, ramped between
function env(param, t, points, curve = 'exp') {
  param.cancelScheduledValues(t);
  param.setValueAtTime(points[0][1], t + points[0][0]);
  for (const [dt, v] of points.slice(1)) {
    if (curve === 'exp') param.exponentialRampToValueAtTime(Math.max(v, 0.0001), t + dt);
    else param.linearRampToValueAtTime(v, t + dt);
  }
}
// While a note is being built, every sound source it makes is collected
// here, so the note can later be bent (all sources together) or stopped.
let collecting = null;
function osc(type, freq, t, dur, out) {
  const o = audio.createOscillator();
  o.type = type;
  o.frequency.value = freq;
  if (out) o.connect(out);     // (an FM modulator is connected by hand instead)
  o.start(t);
  o.stop(t + dur + 0.1);
  if (collecting) collecting.push(o);
  return o;
}
function gainNode(value, out) {
  const g = audio.createGain();
  g.gain.value = value;
  if (out) g.connect(out);
  return g;
}
function filterNode(type, freq, q, out) {
  const f = audio.createBiquadFilter();
  f.type = type;
  f.frequency.value = freq;
  f.Q.value = q;
  if (out) f.connect(out);
  return f;
}
let noiseBuffer = null;
function noise(t, dur, out) {
  if (!noiseBuffer) {
    noiseBuffer = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
    const d = noiseBuffer.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = audio.createBufferSource();
  src.buffer = noiseBuffer;
  src.loop = true;
  src.connect(out);
  src.start(t, Math.random() * 1.5);
  src.stop(t + dur + 0.1);
  if (collecting) collecting.push(src);
  return src;
}
// Several sine waves at multiples of the pitch, each with its own level and fade
// list: [[multiple, level, seconds to fade away], ...]
function partials(f, list, t, out, attack = 0.003) {
  for (const [mult, level, fadeTime] of list) {
    if (f * mult > 16000) continue;          // too high to hear: skip it
    const g = gainNode(0, out);
    env(g.gain, t, [[0, 0.0001], [attack, level], [attack + fadeTime, 0.0001]]);
    osc('sine', f * mult, t, attack + fadeTime, g);
  }
}
// Vibrato: a slow wobble in pitch, fading in after a moment, like a player's finger or voice
function vibrato(oscs, t, dur, rate, cents, delay) {
  const lfo = audio.createOscillator();
  lfo.frequency.value = rate;
  const depth = gainNode(0);
  env(depth.gain, t, [[0, 0], [delay, 0], [delay + 0.3, cents]], 'lin');
  lfo.connect(depth);
  for (const o of oscs) depth.connect(o.detune);
  lfo.start(t);
  lfo.stop(t + dur + 0.1);
  if (collecting) { lfo.noBend = true; collecting.push(lfo); }   // stopped with the note, never bent
}
// A volume shape for sustained notes: rise, hold, fall
function swell(out, t, attack, hold, release, level = 1) {
  const g = gainNode(0, out);
  env(g.gain, t, [[0, 0], [attack, level], [attack + hold, level * 0.85], [attack + hold + release, 0]], 'lin');
  return g;
}

// Play one note. loudness 0-1, t = audio clock time.
// held: a sustaining instrument keeps sounding until voice.release() is called.
// Returns a "voice": a handle for bending or releasing the note later.
function playNote(id, midi, loudness, t, held = false) {
  if (!audio) return null;
  collecting = [];
  try { return buildNote(id, midi, loudness, t, held); }
  finally { collecting = null; }
}

function buildNote(id, midi, loudness, t, held) {
  t = Math.max(t || 0, audio.currentTime);
  const I = INSTRUMENTS[id];
  midi += 12 * I.shift;
  const f = midiToPitch(midi);
  // The gate: one volume knob for the whole note, so releasing it is one move
  const gate = gainNode(1, busFor(id));
  const out = gainNode(0.25 + 0.75 * loudness, gate);
  const L = held ? 60 : NOTE_HOLD;     // a held note's envelopes run long; release() ends it
  const voice = makeVoice(gate, collecting);

  switch (I.sound) {
    case 'pluck': {
      const src = audio.createBufferSource();
      src.buffer = stringNote(id, midi);
      // Soft plucks sound darker, hard plucks brighter
      src.connect(filterNode('lowpass', 1200 + 7000 * loudness * loudness, 0.7, out));
      src.start(t);
      collecting.push(src);
      break;
    }
    case 'piano': {
      // Piano strings are stiff, so each overtone sits slightly sharp of an
      // exact multiple ("inharmonicity"). Low notes ring longer than high ones.
      const ring = clamp(4 * Math.pow(220 / f, 0.5), 0.8, 6);
      const tone = filterNode('lowpass', 2000 + 6000 * loudness, 0.5, out);
      const list = [];
      for (let n = 1; n <= 10; n++) list.push([n * Math.sqrt(1 + 0.0004 * n * n), 0.5 / Math.pow(n, 1.1), ring / (1 + 0.5 * (n - 1))]);
      partials(f, list, t, tone, 0.002);
      // The felt hammer's thump
      const thump = gainNode(0, filterNode('lowpass', 1500, 0.7, out));
      env(thump.gain, t, [[0, 0.0001], [0.002, 0.25 * loudness], [0.04, 0.0001]]);
      noise(t, 0.05, thump);
      break;
    }
    case 'epiano': {
      // FM: a modulator wobbles the carrier's pitch. A strong wobble at the
      // start gives the bell-like "tine" attack; as it fades, the tone mellows.
      const amp = gainNode(0, out);
      env(amp.gain, t, [[0, 0.0001], [0.003, 0.6], [2.5, 0.0001]]);
      const car = osc('sine', f, t, 2.5, amp);
      const mod = audio.createOscillator();
      mod.frequency.value = f;
      const depth = gainNode(0);
      env(depth.gain, t, [[0, f * (1.5 + 2 * loudness)], [0.8, f * 0.2]]);
      mod.connect(depth);
      depth.connect(car.frequency);
      mod.start(t); mod.stop(t + 2.6);
      partials(f, [[14, 0.06 * loudness, 0.15]], t, out);      // the tine's ping
      break;
    }
    case 'organ': {
      // Drawbars: sines at set multiples, held flat while the key is down.
      // A slow pitch wobble imitates a rotating speaker.
      const g = swell(out, t, 0.01, L, 0.08, 0.5);
      const oscs = [[0.5, 0.5], [1, 0.8], [2, 0.6], [3, 0.35], [4, 0.3], [6, 0.15], [8, 0.12]]
        .filter(([m]) => f * m < 14000)
        .map(([m, lv]) => osc('sine', f * m, t, L + 0.1, gainNode(lv * 0.35, g)));
      vibrato(oscs, t, L + 0.1, 6.5, 6, 0);
      const click = gainNode(0, filterNode('bandpass', 2500, 1, out));
      env(click.gain, t, [[0, 0.0001], [0.001, 0.08], [0.015, 0.0001]]);
      noise(t, 0.02, click);
      break;
    }
    case 'marimba':
      // A wooden bar: the main tone, plus a 4x overtone that dies away fast
      partials(f, [[1, 0.6, clamp(1.2 * 220 / f, 0.3, 1.5)], [3.98, 0.25 * loudness, 0.12], [9.9, 0.08 * loudness, 0.04]], t, out, 0.002);
      break;
    case 'kalimba':
      // A metal tine: a pure tone with a bright, quickly fading ping on top
      partials(f, [[1, 0.6, 1.4], [5.9, 0.2 * loudness, 0.09], [8.9, 0.08 * loudness, 0.05]], t, out, 0.002);
      break;
    case 'steelpan':
      // A steel drum's notes have strong overtones at 2x and 3x, a little out of line
      partials(f, [[1, 0.5, 1.6], [2.01, 0.35, 1.0], [3, 0.18, 0.5], [4.03, 0.08, 0.25]], t, out, 0.004);
      break;
    case 'bells':
      // A bell's overtones are not whole multiples, which is what makes it a bell.
      // These ratios are the classic ones from Jean-Claude Risset's 1960s bell.
      partials(f, [[0.56, 0.35, 5], [0.92, 0.25, 3.5], [1.19, 0.3, 2.5], [1.71, 0.25, 2], [2, 0.2, 1.6],
                   [2.74, 0.18, 1.3], [3, 0.15, 1], [3.76, 0.1, 0.8], [4.07, 0.08, 0.7]], t, out, 0.002);
      break;
    case 'bowed': {
      // A bowed string: a sawtooth (the bow's stick-and-slip motion), shaped by
      // the wooden body (filters), with vibrato and a little bow noise
      const g = swell(out, t, 0.09, L, 0.25, 0.45);
      const body = filterNode('lowpass', I.bright, 0.7, g);
      const o = osc('sawtooth', f, t, L + 0.4, body);
      vibrato([o], t, L + 0.4, 5.5, 14, 0.18);
      const bow = gainNode(0.04 * loudness, filterNode('bandpass', f * 3, 2, g));
      noise(t, L + 0.3, bow);
      break;
    }
    case 'ensemble': {
      // A section of strings: three sawtooths, slightly out of tune with each
      // other, so they thicken like many players at once. Slow to rise.
      const g = swell(out, t, 0.25, L, 0.5, 0.3);
      const tone = filterNode('lowpass', 2200, 0.5, g);
      const oscs = [-8, 0, 8].map(c => { const o = osc('sawtooth', f, t, L + 0.8, tone); o.detune.value = c; return o; });
      vibrato(oscs, t, L + 0.8, 4.5, 6, 0.3);
      break;
    }
    case 'flute': {
      // Mostly a pure tone, plus breath: noise tuned near the note
      const g = swell(out, t, 0.07, L, 0.15, 0.55);
      const o1 = osc('sine', f, t, L + 0.3, g);
      const o2 = osc('sine', f * 2, t, L + 0.3, gainNode(0.12, g));
      vibrato([o1, o2], t, L + 0.3, 5, 10, 0.15);
      noise(t, L + 0.3, gainNode(0.05 + 0.05 * loudness, filterNode('bandpass', f * 2, 3, g)));
      break;
    }
    case 'brass': {
      // A trumpet, built from its harmonics (sine waves at 1x, 2x, 3x... the
      // note's pitch), following Jean-Claude Risset's 1960s study of real
      // trumpet recordings. Two things make it brass:
      //   • Louder notes have stronger high harmonics: the harder you blow,
      //     the brighter it gets. "slope" is how fast the harmonics fall away.
      //   • High harmonics start a few milliseconds after low ones. That
      //     stagger is the "blat" at the start of a brass note.
      // The 2nd harmonic is the strongest, as on a real trumpet.
      const slope = 5.5 - 3.5 * loudness;               // dB lost per harmonic: 5.5 soft, 2 loud
      const g = gainNode(0.16);
      // A resonance near 1,400 Hz gives the brassy ring
      const ring = audio.createBiquadFilter();
      ring.type = 'peaking'; ring.frequency.value = 1400; ring.Q.value = 1.1; ring.gain.value = 4;
      g.connect(ring);
      ring.connect(out);
      const oscs = [];
      for (let n = 1; n <= 16 && f * n < 12000; n++) {
        const db = n === 1 ? -3 : -(n - 2) * slope;
        const level = Math.pow(10, db / 20);
        const h = gainNode(0, g);
        const rise = 0.015 + 0.006 * n;                  // later for higher harmonics
        env(h.gain, t, [[0, 0], [rise, level], [0.15, level * 0.85], [L, level * 0.8], [L + 0.12, 0]], 'lin');
        oscs.push(osc('sine', f * n, t, L + 0.3, h));
      }
      // The lip "scoop": start a little flat and slide up into the note
      for (const o of oscs) env(o.detune, t, [[0, -35], [0.05, 0]], 'lin');
      vibrato(oscs, t, L + 0.3, 5.5, 9, 0.3);
      // A puff of breath at the start
      const puff = gainNode(0, filterNode('bandpass', 1800, 2, out));
      env(puff.gain, t, [[0, 0.0001], [0.01, 0.05 * loudness + 0.02], [0.07, 0.0001]]);
      noise(t, 0.08, puff);
      break;
    }
    case 'voices': {
      // "Aah": a buzzy tone through three narrow filters at the resonances of
      // an open mouth (called formants). Two voices, slightly apart.
      const g = swell(out, t, 0.2, L, 0.4, 0.9);
      const mouth = gainNode(1);
      for (const [fr, q, lv] of [[800, 8, 1], [1150, 9, 0.6], [2900, 10, 0.25]]) mouth.connect(filterNode('bandpass', fr, q, gainNode(lv, g)));
      const oscs = [-6, 6].map(c => { const o = osc('sawtooth', f, t, L + 0.6, mouth); o.detune.value = c; return o; });
      vibrato(oscs, t, L + 0.6, 5, 15, 0.2);
      break;
    }
    case 'synth': {
      // Two buzzy oscillators and a filter that sweeps closed: the classic analog pluck
      const g = swell(out, t, 0.005, L * 0.7, 0.25, 0.35);
      const tone = filterNode('lowpass', 4000, 6, g);
      env(tone.frequency, t, [[0, 600 + 5000 * loudness], [0.35, 700]]);
      for (const c of [-10, 10]) { const o = osc('sawtooth', f, t, L + 0.3, tone); o.detune.value = c; }
      osc('square', f / 2, t, L + 0.3, gainNode(0.3, tone));
      break;
    }
    case 'sub': {
      // The 808: a sine that starts high and drops to the note in a blink,
      // then booms. Gentle distortion adds overtones, so laptop speakers can play it.
      const amp = gainNode(0, out);
      env(amp.gain, t, [[0, 0.0001], [0.005, 0.9], [1.4, 0.0001]]);
      const shaper = audio.createWaveShaper();
      const curve = new Float32Array(512);
      for (let i = 0; i < 512; i++) { const x = i / 255.5 - 1; curve[i] = Math.tanh(2.2 * x); }
      shaper.curve = curve;
      shaper.connect(amp);
      const o = osc('sine', f, t, 1.4, shaper);
      env(o.frequency, t, [[0, f * 3], [0.05, f]]);
      break;
    }
  }
  return voice;
}

// A voice: everything needed to bend or end one note
function makeVoice(gate, sources) {
  return {
    sources,
    // Bend every source's pitch by "cents" (100 cents = 1 semitone), gliding over "glide" seconds
    bend(cents, glide = 0.03) {
      const t = audio.currentTime;
      for (const src of sources) {
        if (!src.detune || src.noBend) continue;
        if (src.baseDetune === undefined) src.baseDetune = src.detune.value;
        src.detune.cancelScheduledValues(t);
        src.detune.setTargetAtTime(src.baseDetune + cents, t, glide);
      }
    },
    // Fade the note out over "fade" seconds, then stop everything in it
    release(fade = 0.2) {
      const t = audio.currentTime;
      gate.gain.cancelScheduledValues(t);
      gate.gain.setValueAtTime(gate.gain.value, t);
      gate.gain.setTargetAtTime(0, t, fade / 3);
      for (const src of sources) { try { src.stop(t + fade + 0.1); } catch (e) { /* already stopped */ } }
    },
    // The same, booked for a time in the future (used when a loop replays a held note)
    releaseAt(t, fade = 0.2) {
      gate.gain.setTargetAtTime(0, t, fade / 3);
      for (const src of sources) { try { src.stop(t + fade + 0.1); } catch (e) { /* already stopped */ } }
    },
  };
}

// ── 12d. Drums ───────────────────────────────────────────────
// On a drum string, every zone is a different drum, low sounds at the low
// end. Each drum is built from a tone that drops in pitch (the skin), and
// filtered noise (snares, cymbals, slaps).
const DRUM_KITS = {
  drums:     ['Kick', 'Low tom', 'Snare', 'High tom', 'Clap', 'Closed hat', 'Open hat', 'Crash'],
  handdrums: ['Doum', 'Low conga', 'Slap', 'High conga', 'Tek', 'Ka', 'Shaker'],
};

function playDrum(id, name, loudness, t) {
  if (!audio) return;
  t = Math.max(t || 0, audio.currentTime);
  const out = gainNode(0.3 + 0.7 * loudness, busFor(id));

  // A skin: a tone that falls from f0 to f1, fading over "fade" seconds
  const skin = (f0, f1, drop, fade, level, type = 'sine') => {
    const g = gainNode(0, out);
    env(g.gain, t, [[0, 0.0001], [0.002, level], [fade, 0.0001]]);
    const o = osc(type, f0, t, fade, g);
    env(o.frequency, t, [[0, f0], [drop, f1]]);
  };
  // A burst of noise through a filter
  const hiss = (type, freq, q, fade, level, at = 0) => {
    const g = gainNode(0, filterNode(type, freq, q, out));
    env(g.gain, t + at, [[0, 0.0001], [0.002, level], [fade, 0.0001]]);
    noise(t + at, fade, g);
  };

  switch (name) {
    case 'Kick':       skin(160, 45, 0.1, 0.5, 1);  hiss('lowpass', 3000, 0.7, 0.015, 0.3); break;
    case 'Low tom':    skin(140, 95, 0.15, 0.45, 0.8); break;
    case 'Snare':      skin(220, 180, 0.05, 0.12, 0.45, 'triangle'); hiss('bandpass', 2200, 0.8, 0.2, 0.7); break;
    case 'High tom':   skin(210, 150, 0.12, 0.35, 0.75); break;
    case 'Clap':       for (const at of [0, 0.011, 0.023]) hiss('bandpass', 1300, 1.5, 0.03, 1.8, at); hiss('bandpass', 1300, 1.2, 0.25, 1.1, 0.03); break;
    case 'Closed hat': hiss('highpass', 7500, 0.7, 0.05, 0.45); break;
    case 'Open hat':   hiss('highpass', 7000, 0.7, 0.4, 0.35); break;
    case 'Crash':      hiss('highpass', 4500, 0.5, 1.6, 0.35); hiss('bandpass', 6500, 1, 0.8, 0.2); break;
    // Hand drums. Doum and tek are the deep centre and the sharp rim of a darbuka.
    case 'Doum':       skin(110, 75, 0.08, 0.6, 0.9); hiss('lowpass', 800, 0.7, 0.03, 0.2); break;
    case 'Low conga':  skin(210, 190, 0.05, 0.35, 0.7); hiss('bandpass', 1200, 1, 0.03, 0.15); break;
    case 'Slap':       skin(330, 300, 0.03, 0.12, 0.35); hiss('bandpass', 1600, 1.2, 0.12, 0.6); break;
    case 'High conga': skin(320, 290, 0.05, 0.28, 0.65); hiss('bandpass', 1800, 1, 0.03, 0.15); break;
    case 'Tek':        skin(900, 820, 0.02, 0.06, 0.35); hiss('bandpass', 3200, 1.5, 0.07, 0.5); break;
    case 'Ka':         skin(700, 650, 0.02, 0.05, 0.4); hiss('bandpass', 2600, 1.5, 0.05, 0.55); break;
    case 'Shaker': {
      const g = gainNode(0, filterNode('highpass', 6000, 0.7, out));
      env(g.gain, t, [[0, 0], [0.04, 0.35], [0.14, 0]], 'lin');
      noise(t, 0.15, g);
      break;
    }
  }
}

// ── 13. Plucking ─────────────────────────────────────────────
// Same idea as Stage 3, now for every string: the cross product says
// which side of a string a pointer is on, and switching sides is a pluck.
const DEAD_BAND = 6;      // pixels either side of a string that count as neither side
const COOLDOWN = 0.1;     // seconds between plucks of one string by one pointer
const FORGET_AFTER = 0.4; // seconds: a pointer unseen for longer starts fresh
const NEW_STRING_QUIET = 0.4;   // seconds: a brand-new string can't be plucked yet (your hands are on it)

function sideOf(s, p) {
  const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y;
  return (dx * (p.y - s.a.y) - dy * (p.x - s.a.x)) / Math.hypot(dx, dy);
}
function alongOf(s, p) {
  const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y;
  return ((p.x - s.a.x) * dx + (p.y - s.a.y) * dy) / (dx * dx + dy * dy);
}

function checkPluck(id, p, now) {
  for (const s of strings) {
    if (dist(s.a, s.b) < 1) continue;
    const d = sideOf(s, p);
    let mem = s.mem[id];
    if (!mem || now - mem.seen > FORGET_AFTER) mem = s.mem[id] = { side: 0, at: { ...p }, atTime: now, seen: now, last: 0 };
    mem.seen = now;

    // A finger holding this string: keep the hold going, and don't pluck
    if (checkHold(s, id, p, d, mem, now)) {
      if (Math.abs(d) >= DEAD_BAND) mem.side = Math.sign(d);
      mem.at = { ...p }; mem.atTime = now;
      continue;
    }

    if (Math.abs(d) < DEAD_BAND) continue;
    const side = Math.sign(d);

    if (mem.side && side !== mem.side && now - mem.last > COOLDOWN && now - s.born > NEW_STRING_QUIET) {
      const dOld = sideOf(s, mem.at);
      const k = dOld / (dOld - d);
      const u = alongOf(s, { x: lerp(mem.at.x, p.x, k), y: lerp(mem.at.y, p.y, k) });
      if (u >= 0 && u <= 1) {
        const speed = dist(p, mem.at) / Math.max(now - mem.atTime, 0.008);
        pluck(s, u, clamp(0.25 + speed / 3000, 0.25, 1), mem.side);
        mem.last = now;
      }
    }
    mem.side = side;
    mem.at = { ...p };
    mem.atTime = now;
  }
}

// u = where along the string (0 at peg a, 1 at peg b); fromSide = which side the finger came from
function pluck(s, u, loudness, fromSide = 1) {
  const z = zoneAt(s, u);
  const { notes, drum, label } = zoneNotes(s, z);
  const t = audio ? audio.currentTime : 0;

  if (drum) playDrum(s.inst, drum, loudness, t);
  else {
    // A chord is strummed: each note a little after the last, like a pick
    // crossing guitar strings. Sweep one way and it goes low to high; sweep
    // back and it goes high to low.
    const order = fromSide > 0 ? notes : [...notes].reverse();
    order.forEach((m, i) => playNote(s.inst, m, loudness * (notes.length > 1 ? 0.6 : 1), t + i * STRUM_GAP));
  }
  // The looper records it (unless this is the menu's quiet preview)
  if (!menu.open) captureEvent(drum ? { inst: s.inst, drum, vel: loudness } : { inst: s.inst, notes: fromSide > 0 ? notes : [...notes].reverse(), vel: loudness });

  s.wobble = 6 + 18 * loudness;
  s.wobbleAt = performance.now();
  s.wobbleU = clamp(u, 0.1, 0.9);
  s.flashZone = z;
  s.plucks++;
  s.lastNotes = notes;
  const at = { x: lerp(s.a.x, s.b.x, u), y: lerp(s.a.y, s.b.y, u) };
  pops.push({ ...at, text: label, t: performance.now() });
}

// Which pointers may pluck right now?
//   • an open hand's index fingertip, if the hand isn't pinching, is
//     clearly open (not halfway into a pinch), and didn't just let go of one
//   • the mouse, while no button is pressed
function plucking(now) {
  if (menu.open) return;    // a menu is open: hands are choosing, not playing
  slots.forEach((h, j) => {
    if (!h || h.pinched || grabs['hand' + j]) return;
    if (h.ratio < settings.openAt || now - h.released < settings.pluckPause) return;
    checkPluck('hand' + j, h.pts[INDEX_TIP], now);
  });
  if (mouse.on && !mouse.down) checkPluck('mouse', mouse, now);
}

// ── 14. The loop ─────────────────────────────────────────────
let fps = 0, frames = 0, fpsClock = performance.now();

function loop() {
  requestAnimationFrame(loop);
  const now = seconds();

  if (tracker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = tracker.detectForVideo(video, performance.now());
    const fit = videoFit();
    assignHands(result.landmarks.map(points => points.map(p => toScreen(p, fit))), now);
    frames++;
  }

  updateGrabs(now);
  updateMenu(now);
  updateButtonHover(now);
  updateDotHold(now);
  if (beat.dirty) { beat.dirty = false; showMusic(); }
  plucking(now);
  updateHolds(now);
  draw();
  updatePanel();

  const t = performance.now();
  if (t - fpsClock > 1000) {
    fps = Math.round(frames * 1000 / (t - fpsClock));
    frames = 0; fpsClock = t;
  }
}

// ── 15. Drawing ──────────────────────────────────────────────
function draw() {
  ctx.fillStyle = COLORS.room;
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  if (video.videoWidth) {
    const fit = videoFit();
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.translate(innerWidth, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, fit.ox, fit.oy, fit.vw * fit.scale, fit.vh * fit.scale);
    ctx.restore();
  }
  if (!started) return;

  for (const s of strings) drawString(s);
  drawPreview();
  drawAirPad();
  drawBeatLights();
  drawLoopStatus();
  drawBursts();
  drawPops();
  drawMenu();
  slots.forEach((h, i) => h && drawHand(h, i));
  if (mouse.on) drawAim({ x: mouse.x, y: mouse.y }, COLORS.hands[0], mouse.down);
}

// A string shakes after a pluck, most at the spot you plucked, and settles
function drawString(s) {
  const { a, b } = s;
  const age = (performance.now() - s.wobbleAt) / 1000;
  const amp = s.wobble * Math.exp(-age * 5) * Math.cos(age * 70);
  const len = Math.max(dist(a, b), 1);
  const nx = -(b.y - a.y) / len, ny = (b.x - a.x) / len;   // straight out from the string

  // A string being dragged shorter than deleteBelow turns red: let go to delete
  const doomed = len < settings.deleteBelow;
  ctx.strokeStyle = doomed ? COLORS.hands[1] : COLORS.bone;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const STEPS = 40;
  // A pulled string bends into a tent with its peak at the pinch.
  // A held string trembles a little for as long as it's held.
  const pull = s.pull ? s.pull.d : 0, pullU = s.pull ? s.pull.u : 0.5;
  const shiver = Object.keys(s.holds).length ? 2.5 * Math.sin(performance.now() / 18) : 0;
  for (let i = 0; i <= STEPS; i++) {
    const u = i / STEPS;
    const w = u < s.wobbleU ? u / s.wobbleU : (1 - u) / (1 - s.wobbleU);   // tent shape
    const wp = u < pullU ? u / pullU : (1 - u) / (1 - pullU);
    const off = amp * w + pull * wp + shiver * Math.sin(Math.PI * u);
    const x = lerp(a.x, b.x, u) + nx * off;
    const y = lerp(a.y, b.y, u) + ny * off;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();

  // Where a finger is holding the string: a soft glow
  for (const h of Object.values(s.holds)) {
    const q = { x: lerp(a.x, b.x, h.u), y: lerp(a.y, b.y, h.u) };
    ctx.fillStyle = COLORS.hands[0];
    ctx.globalAlpha = 0.35 + 0.15 * Math.sin(performance.now() / 90);
    ctx.beginPath();
    ctx.arc(q.x, q.y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Zone marks: a small tick across the string between each pair of notes.
  // The zone just plucked glows for a moment. (Hidden while the string is pulled into a bend.)
  if (!doomed && !s.pull) {
    const n = zoneCount(s), low = lowEnd(s);
    const P = k => {   // point k of the way from the low end (0) to the high end (1)
      const u = low === 'a' ? k : 1 - k;
      return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u) };
    };
    ctx.strokeStyle = COLORS.dust;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let z = 1; z < n; z++) {
      const q = P(z / n);
      ctx.moveTo(q.x - nx * 6, q.y - ny * 6);
      ctx.lineTo(q.x + nx * 6, q.y + ny * 6);
    }
    ctx.stroke();

    const glow = 1 - (performance.now() - s.wobbleAt) / 400;
    if (glow > 0 && s.flashZone != null) {
      const p0 = P(s.flashZone / n), p1 = P((s.flashZone + 1) / n);
      ctx.strokeStyle = COLORS.hands[0];
      ctx.globalAlpha = glow;
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // The middle dot: pinch it and let go to open this string's menu
  if (!doomed && !s.pull) {
    const m = mid(a, b);
    ctx.fillStyle = COLORS.room;
    ctx.strokeStyle = menu.s === s ? COLORS.hands[0] : COLORS.dust;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(m.x, m.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // The instrument's name, just off the string, on the side away from the menu
    ctx.font = '600 13px "Bricolage Grotesque", "Air Accidentals", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = COLORS.dust;
    const side = ny > 0 ? 1 : -1;    // push the label downward, whichever way the string slopes
    ctx.fillText(INSTRUMENTS[s.inst].name, m.x + nx * 26 * side, m.y + ny * 26 * side + 4);

    // A fingertip is holding the dot: a ring fills around it
    const k = dotHoldProgress(s);
    if (k !== null) {
      ctx.strokeStyle = COLORS.hands[0];
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(m.x, m.y, 18, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2);
      ctx.stroke();
    }
  }

  // Pegs: the low end is a filled dot, the high end a ring, so you can tell them apart
  ctx.fillStyle = ctx.strokeStyle = doomed ? COLORS.hands[1] : COLORS.hands[0];
  const lowPeg = s[lowEnd(s)], highPeg = s[lowEnd(s) === 'a' ? 'b' : 'a'];
  dot(lowPeg, 7);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(highPeg.x, highPeg.y, 6, 0, Math.PI * 2);
  ctx.stroke();
}

// The note name floats up from where you plucked, and fades
const pops = [];
function drawPops() {
  const t = performance.now();
  ctx.font = '600 20px "Bricolage Grotesque", "Air Accidentals", sans-serif';
  ctx.textAlign = 'center';
  for (let i = pops.length - 1; i >= 0; i--) {
    const k = (t - pops[i].t) / 900;
    if (k >= 1) { pops.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = COLORS.bone;
    ctx.fillText(pops[i].text, pops[i].x, pops[i].y - 24 - k * 40);
  }
  ctx.globalAlpha = 1;
}

// The dashed line while a new string is being stretched.
// Dim until it's ready to keep, bright once letting go will make the string.
function drawPreview() {
  if (!preview) return;
  const long = preview.ready;
  ctx.strokeStyle = long ? COLORS.bone : COLORS.dust;
  ctx.globalAlpha = long ? 1 : 0.6;
  ctx.lineWidth = 3;
  ctx.setLineDash([10, 10]);
  ctx.lineDashOffset = -performance.now() / 30;
  ctx.beginPath();
  ctx.moveTo(preview.a.x, preview.a.y);
  ctx.lineTo(preview.b.x, preview.b.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawBursts() {
  const t = performance.now();
  for (let i = bursts.length - 1; i >= 0; i--) {
    const k = (t - bursts[i].t) / 500;
    if (k >= 1) { bursts.splice(i, 1); continue; }
    ctx.strokeStyle = bursts[i].color;
    ctx.globalAlpha = 1 - k;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(bursts[i].x, bursts[i].y, 10 + k * 70, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawHand(h, i) {
  const color = COLORS.hands[i];
  const p = h.pts;

  ctx.strokeStyle = COLORS.dust;
  ctx.globalAlpha = 0.45;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const [m, n] of BONES) { ctx.moveTo(p[m].x, p[m].y); ctx.lineTo(p[n].x, p[n].y); }
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.fillStyle = COLORS.dust;
  for (const q of p) dot(q, 2.5);
  ctx.fillStyle = color;
  for (const k of FINGERTIPS) dot(p[k], k === INDEX_TIP ? 9 : 6);   // the index tip plucks, so it's biggest

  drawAim(h.cursor, color, h.pinched, h.flash);

  // Holding on a top-bar button: a ring fills around the fingertip, then it's pressed
  if (h.btnDwell && !h.btnDwell.done) {
    const k = clamp((seconds() - h.btnDwell.since) / settings.holdTime, 0, 1);
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(h.cursor.x, h.cursor.y, 26, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2);
    ctx.stroke();
  }
}

// The pinch point. When it's near a peg, the peg gets a ring, so you can
// see what a pinch would grab before you close it.
function drawAim(p, color, closed, flash = 0) {
  // Show what a pinch here would grab: a peg first, then a string's middle dot
  const tg = !closed && !menu.open && targetAt(p, false);
  const target = !tg || tg.kind === 'button' ? null : targetPos(tg);
  if (target) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(target.x, target.y, 16, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.strokeStyle = color;
  ctx.lineWidth = closed ? 6 : 2;
  ctx.beginPath();
  ctx.arc(p.x, p.y, closed ? 14 : 20, 0, Math.PI * 2);
  ctx.stroke();

  const age = (performance.now() - flash) / 300;
  if (age < 1) {
    ctx.globalAlpha = 1 - age;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 14 + age * 36, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function dot(p, r) {
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.fill();
}

// ── 16. The panel: live pinch numbers and the two sliders ────
const METER_MAX = 1.2;
const pct = v => clamp(v / METER_MAX, 0, 1) * 100 + '%';

function updatePanel() {
  $('fps').textContent = `Hands: ${slots.filter(Boolean).length}, tracking ${fps} times a second`;
  slots.forEach((h, i) => {
    const m = $('m' + i);
    const fill = m.querySelector('.fill');
    fill.style.width = h ? pct(h.ratio) : '0';
    fill.style.background = h && h.pinched ? COLORS.hands[i] : COLORS.dust;
    m.querySelector('.close').style.left = pct(settings.closeAt);
    m.querySelector('.open').style.left = pct(settings.openAt);
    $('n' + i).textContent = h ? h.ratio.toFixed(2) : '-';
  });
}

function showSettings() {
  for (const k of ['closeAt', 'openAt']) {
    $(k).value = settings[k];
    $(k.replace('At', 'Val')).textContent = settings[k].toFixed(2);
  }
}
for (const key of ['closeAt', 'openAt']) {
  $(key).addEventListener('input', () => {
    settings[key] = +$(key).value;
    if (settings.openAt < settings.closeAt + 0.05) {
      if (key === 'closeAt') settings.openAt = settings.closeAt + 0.05;
      else settings.closeAt = settings.openAt - 0.05;
    }
    showSettings();
  });
}
showSettings();

// ── 17. The mouse plays too ──────────────────────────────────
// Moving the mouse is an open fingertip: it plucks.
// Pressing the button is a pinch: press on a peg to drag it, or press in
// empty space and drag to stretch a new string.
const mouse = { on: false, down: false, x: -99, y: -99 };

$('mouse').addEventListener('click', () => {
  startAudio();
  mouse.on = true;
  begin();
});
canvas.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('pointerdown', e => {
  if (!mouse.on) return;
  mouse.x = e.clientX; mouse.y = e.clientY;
  mouse.down = true;
  mouse.shift = e.shiftKey;     // Shift-drag works the air pad
  pinchStart('mouse', { x: mouse.x, y: mouse.y }, seconds());
});
addEventListener('pointerup', () => {
  if (!mouse.down) return;
  mouse.down = false;
  pinchEnd('mouse', seconds());
});

// ── 18. Notes along a string ─────────────────────────────────
// A string is cut into equal zones, one note per zone. The number of
// zones depends on length: one per ZONE_SIZE pixels, so a longer string
// holds more notes. Notes climb from the low end to the high end.
//
// Music in numbers: every note has a MIDI number. Middle C is 60, and each
// step up (a semitone, one piano key) adds 1. 12 steps make an octave,
// which doubles the pitch. A4 = 69 = 440 vibrations per second.
const ZONE_SIZE = 70;               // pixels per note
const MIN_ZONES = 3, MAX_ZONES = 15;
const BASE_NOTE = 48;               // C3: the lowest note of a string in the key of C
const STRUM_GAP = 0.018;            // seconds between the notes of a strummed chord

const NOTE_NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];

// A scale is the set of steps, counted up from the key note, that sound
// good together. "parent" is the full 7-note scale used to build chords.
const SCALES = {
  major:    { name: 'Major',            steps: [0, 2, 4, 5, 7, 9, 11] },
  minor:    { name: 'Minor',            steps: [0, 2, 3, 5, 7, 8, 10] },
  pentamaj: { name: 'Major pentatonic', steps: [0, 2, 4, 7, 9],        parent: 'major' },
  pentamin: { name: 'Minor pentatonic', steps: [0, 3, 5, 7, 10],       parent: 'minor' },
  blues:    { name: 'Blues',            steps: [0, 3, 5, 6, 7, 10],    parent: 'minor' },
  dorian:   { name: 'Dorian',           steps: [0, 2, 3, 5, 7, 9, 10] },
  hijaz:    { name: 'Hijaz',            steps: [0, 1, 4, 5, 7, 8, 10] },
};
const SCALE_ORDER = Object.keys(SCALES);

const music = { key: 0, scale: 'major', mode: 'notes', follow: false };

// The backing beat's state (Stage 11, section 26). It lives up here because
// the top bar shows whether the beat is playing from the moment the page loads.
const beat = {
  playing: false, pattern: 'boombap', bpm: 90,
  parts: { kick: false, snare: false, hats: false, bass: false, chords: false },
  step: 0, nextTime: 0, timer: null, dirty: false,
  booked: [],                      // recently booked steps and their times, for the lights
};

// The looper's state (Stage 12, section 27), up here for the same reason
const rec = { armed: false, on: false, len: 32, snap: true, start: 0, startTime: 0, events: [] };
const layers = [];   // key 0 = C, 1 = C♯ ... 11 = B

const midiToPitch = m => 440 * Math.pow(2, (m - 69) / 12);
const noteName = m => NOTE_NAMES[((m % 12) + 12) % 12];

function zoneCount(s) {
  const n = clamp(Math.round(dist(s.a, s.b) / ZONE_SIZE), MIN_ZONES, MAX_ZONES);
  // A drum string has one zone per drum in its kit, at most
  const kit = DRUM_KITS[s.inst];
  return kit ? Math.min(n, kit.length) : n;
}

// The low end is the left peg. On a steep string (closer to upright than
// flat) it's the bottom peg, so notes rise as you go up.
function lowEnd(s) {
  const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y;
  if (Math.abs(dy) > Math.abs(dx)) return dy > 0 ? 'b' : 'a';
  return dx >= 0 ? 'a' : 'b';
}

// Which zone is at position u (0 at peg a, 1 at peg b)? Zone 0 is at the low end.
function zoneAt(s, u) {
  const k = lowEnd(s) === 'a' ? u : 1 - u;
  return clamp(Math.floor(k * zoneCount(s)), 0, zoneCount(s) - 1);
}

// Step number d of a scale, as a MIDI note, for string s. Past the end of
// the scale it wraps round into the next octave: in C major, step 7 is the C above.
function degree(s, scaleId, d) {
  const steps = SCALES[scaleId].steps, n = steps.length;
  return BASE_NOTE + s.key + 12 * s.oct + 12 * Math.floor(d / n) + steps[((d % n) + n) % n];
}

// ── 19. Chords ───────────────────────────────────────────────
// A basic chord (a "triad") is three notes: a scale step, the step two
// above it, and the step two above that. In C major, step 0 gives C-E-G
// (C major), step 1 gives D-F-A (D minor). Every chord fits the key.
//
// Pentatonic and blues scales are too gappy to build chords this way,
