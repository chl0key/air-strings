// so they borrow chords from their parent scale.
function zoneNotes(s, z) {
  // Drum strings: each zone is a drum, not a note
  const kit = DRUM_KITS[s.inst];
  if (kit) return { drum: kit[z], label: kit[z] };
  if (music.follow && beat.playing) return followNotes(s, z);     // Stage 12: follow the beat's chords
  if (s.mode === 'chords') {
    const sc = SCALES[s.scale].parent || s.scale;
    const notes = [0, 2, 4].map(k => degree(s, sc, z + k));
    return { notes, label: chordName(notes) };
  }
  const m = degree(s, s.scale, z);
  return { notes: [m], label: noteName(m) };
}

// Name a triad from the gaps between its notes (in semitones)
function chordName([root, third, fifth]) {
  const a = third - root, b = fifth - root;
  const kind = a === 4 && b === 7 ? '' : a === 3 && b === 7 ? 'm' : a === 3 && b === 6 ? 'dim' : a === 4 && b === 8 ? 'aug' : '?';
  return noteName(root) + kind;
}

// The top-bar buttons set every string at once. (The string menu sets one.)
// Click for the next choice, Shift-click for the previous one.
function setAll(field, value) {
  music[field] = value;
  for (const s of strings) s[field] = value;
  showMusic();
}
function showMusic() {
  $('keyBtn').textContent = 'Key: ' + NOTE_NAMES[music.key];
  $('scaleBtn').textContent = SCALES[music.scale].name;
  $('modeBtn').textContent = music.mode === 'notes' ? 'Single notes' : 'Chords';
  $('beatBtn').textContent = beat.playing ? 'Beat ●' : 'Beat';
  $('loopBtn').textContent = layers.length ? 'Loop ●' : 'Loop';
  $('recBtn').textContent = rec.on ? '● Recording' : rec.armed ? '● Get ready' : '● Rec';
  $('recBtn').classList.toggle('live', rec.on || rec.armed);
}
// Key and Scale have many choices, so they open a panel. Notes/Chords has
// two, so it just switches. Pressing a button again closes its panel.
function togglePanel(kind, btn) {
  if (menu.open && menu.kind === kind) closeMenu();
  else openPanel(kind, btn);
}
$('keyBtn').addEventListener('click', () => togglePanel('key', $('keyBtn')));
$('scaleBtn').addEventListener('click', () => togglePanel('scale', $('scaleBtn')));
$('modeBtn').addEventListener('click', () => setAll('mode', music.mode === 'notes' ? 'chords' : 'notes'));
showMusic();

// Each top-bar button keeps one width: wide enough for its longest label.
// Without this, a button grows and shrinks as its label changes ("Key: C"
// vs "Key: E♭"), and because the bar lines up from the right, every
// change shoves the buttons beside it along.
// Widths are measured in the real font, once it has loaded, so they fit exactly.
const BUTTON_LABELS = {
  keyBtn: () => NOTE_NAMES.map(n => 'Key: ' + n),
  scaleBtn: () => SCALE_ORDER.map(id => SCALES[id].name),
  modeBtn: () => ['Single notes', 'Chords'],
  beatBtn: () => ['Beat', 'Beat ●'],
  recBtn: () => ['● Rec', '● Get ready', '● Recording'],
  loopBtn: () => ['Loop', 'Loop ●'],
};
function fixButtonWidths() {
  if ($('bar').classList.contains('hidden')) return;   // can't measure what isn't shown
  for (const [id, labels] of Object.entries(BUTTON_LABELS)) {
    const el = $(id);
    el.style.width = '';
    let widest = 0;
    for (const text of labels()) { el.textContent = text; widest = Math.max(widest, el.getBoundingClientRect().width); }
    el.style.width = Math.ceil(widest) + 'px';
  }
  showMusic();   // put the real labels back
}
document.fonts.ready.then(fixButtonWidths);
// Canvas text doesn't ask the browser to load fonts, so load the flat and sharp signs up front
document.fonts.load('600 16px "Air Accidentals"', '♭♯').then(fixButtonWidths);

// ── 20. The string menu ──────────────────────────────────────
// Opens beside a string's middle dot. Every option is a box on the canvas.
//
// Two ways to choose with a hand:
//   • Pinch on the option: chosen at once
//   • Hold your pinch point over it: a ring fills, and it's chosen after DWELL seconds
// The mouse just clicks.
//
// A pinch outside the menu, or Done, closes it. So does leaving it alone
// for IDLE_CLOSE seconds.
const IDLE_CLOSE = 10;
// kind: 'string' (one string's menu), 'key' or 'scale' (a top-bar panel that sets every string)
const menu = { open: false, kind: null, s: null, btn: null, items: [], box: null, touched: null, hover: {} };

const SCALE_SHORT = { major: 'Major', minor: 'Minor', pentamaj: 'Maj pent', pentamin: 'Min pent', blues: 'Blues', dorian: 'Dorian', hijaz: 'Hijaz' };
const OCTAVES = [[-1, 'Low'], [0, 'Middle'], [1, 'High']];

function nearestDot(p, radius) {
  let best = null, bd = radius;
  for (const s of strings) {
    if (dist(s.a, s.b) < settings.deleteBelow) continue;
    const d = dist(p, mid(s.a, s.b));
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}

function openMenu(s) { showMenu('string', s, null); }

// A top-bar panel, opened under its button
function openPanel(kind, btn) { showMenu(kind, null, btn); }

function showMenu(kind, s, btn) {
  Object.assign(menu, { open: true, kind, s, btn, hover: {}, touched: null });   // touched is set from the loop's clock next frame
  layoutMenu();
}
function closeMenu() { Object.assign(menu, { open: false, kind: null, s: null, btn: null, items: [], hover: {} }); }

// Build the rows of options, then place the whole menu: beside the string's
// middle for a string menu, under the button for a top-bar panel
function layoutMenu() {
  const s = menu.s, rows = [];
  if (menu.kind === 'key') {
    rows.push({ title: 'Key for every string', items: NOTE_NAMES.map((n, k) => ({ label: n, w: 48, on: () => music.key === k, act: () => setAll('key', k) })) });
    rows.push({ title: '', items: [{ label: 'Done', w: 100, quiet: true, act: () => {} }] });
  } else if (menu.kind === 'scale') {
    rows.push({ title: 'Scale for every string', items: SCALE_ORDER.map(id => ({ label: SCALE_SHORT[id], w: 84, on: () => music.scale === id, act: () => setAll('scale', id) })) });
    rows.push({ title: '', items: [{ label: 'Done', w: 100, quiet: true, act: () => {} }] });
  } else if (menu.kind === 'beat') buildBeatRows(rows);
  else if (menu.kind === 'loop') buildLoopRows(rows);
  else buildStringRows(s, rows);
  placeMenu(rows);
}

const INSTRUMENT_SHORT = { egtr: 'E-guitar', epiano: 'E-piano', handdrums: 'Hand drums', bass808: '808 bass', steelpan: 'Steel pan' };
function buildStringRows(s, rows) {
  // Instruments: four rows of six, one family per row
  for (let fam = 0; fam < 4; fam++) {
    rows.push({ title: fam === 0 ? 'Instrument' : '', tight: fam > 0, items: INSTRUMENT_ORDER.filter(id => INSTRUMENTS[id].family === fam).map(id => ({
      label: INSTRUMENT_SHORT[id] || INSTRUMENTS[id].name, w: 104, on: () => s.inst === id, act: () => { s.inst = id; },
    })) });
  }
  // Drums have no notes, so scale, key, chords and octave don't apply: hide them
  if (DRUM_KITS[s.inst]) {
    rows.push({ title: '', items: [
      { label: 'Delete string', w: 130, danger: true, act: () => { removeString(s); } },
      { gap: 24 },
      { label: 'Done', w: 100, act: () => { closeMenu(); } },
    ] });
    return;
  }
  rows.push({ title: 'Scale', items: SCALE_ORDER.map(id => ({ label: SCALE_SHORT[id], w: 84, on: () => s.scale === id, act: () => { s.scale = id; } })) });
  rows.push({ title: 'Key', items: NOTE_NAMES.map((n, k) => ({ label: n, w: 48, on: () => s.key === k, act: () => { s.key = k; } })) });
  rows.push({ title: 'Play and octave', items: [
    { label: 'Notes', w: 84, on: () => s.mode === 'notes', act: () => { s.mode = 'notes'; } },
    { label: 'Chords', w: 84, on: () => s.mode === 'chords', act: () => { s.mode = 'chords'; } },
    { gap: 24 },
    ...OCTAVES.map(([o, label]) => ({ label, w: 84, on: () => s.oct === o, act: () => { s.oct = o; } })),
  ] });
  rows.push({ title: '', items: [
    { label: 'Delete string', w: 130, danger: true, act: () => { removeString(s); } },
    { gap: 24 },
    { label: 'Done', w: 100, act: () => { closeMenu(); } },
  ] });
}

function placeMenu(rows) {
  const PAD = 16, GAP = 8, H = 40, TITLE = 22;
  const rowW = r => r.items.reduce((w, it) => w + (it.gap || it.w) + GAP, -GAP);
  const W = Math.max(...rows.map(rowW)) + PAD * 2;
  const rowGap = r => r.tight ? GAP : GAP * 1.5;                   // the instrument rows sit closer together
  const Ht = PAD * 2 + rows.reduce((h, r) => h + (r.title ? TITLE : 0) + H + rowGap(r), 0);

  let x, y;
  if (menu.kind === 'string') {
    // Above the string's middle if there's room, otherwise below. Always on screen.
    const m = mid(menu.s.a, menu.s.b);
    x = clamp(m.x - W / 2, 16, Math.max(16, innerWidth - W - 16));
    y = m.y - Ht - 40;
    if (y < 70) y = m.y + 40;
  } else {
    // Under its button, lined up with the button's right edge
    const r = menu.btn.getBoundingClientRect();
    x = clamp(r.right - W, 16, Math.max(16, innerWidth - W - 16));
    y = r.bottom + 12;
  }
  y = clamp(y, 70, Math.max(70, innerHeight - Ht - 16));
  menu.box = { x, y, w: W, h: Ht };

  menu.items = [];
  menu.titles = [];
  let cy = y + PAD;
  for (const r of rows) {
    if (r.title) { menu.titles.push({ text: r.title, x: x + PAD, y: cy + 15 }); cy += TITLE; }
    let cx = x + PAD;
    for (const it of r.items) {
      if (it.gap) { cx += it.gap + GAP; continue; }
      menu.items.push({ ...it, x: cx, y: cy, h: H });
      cx += it.w + GAP;
    }
    cy += H + rowGap(r);
  }
}

function menuItemAt(p) {
  return menu.items.find(it => !it.display && p.x >= it.x && p.x <= it.x + it.w && p.y >= it.y && p.y <= it.y + it.h) || null;
}

function chooseItem(it) {
  const s = menu.s, kind = menu.kind;
  it.act();
  menu.touched = null;
  menu.hover = {};
  if (kind === 'string') {
    // A string menu stays open for more choices. Play the string quietly so you hear it.
    if (menu.open && strings.includes(s)) {
      layoutMenu();     // the rows can change: drums hide the note settings
      pluck(s, 0.5, 0.35, 1);
    }
  } else if (kind === 'beat' || kind === 'loop') {
    // The beat panel stays open: you switch parts on one at a time
    if (menu.open) layoutMenu();
  } else {
    // A top-bar panel is a single choice: close it, and play the first string as a preview
    closeMenu();
    if (strings[0] && !it.quiet) pluck(strings[0], 0.5, 0.35, 1);
  }
}

// Runs every frame: hover rings, dwell choosing, and closing when idle
function updateMenu(now) {
  if (!menu.open) return;
  if (menu.kind === 'string' && !strings.includes(menu.s)) return closeMenu();
  if (menu.touched === null) menu.touched = now;
  if (now - menu.touched > IDLE_CLOSE) return closeMenu();

  slots.forEach((h, j) => {
    const id = 'hand' + j;
    if (!h || h.pinched) { delete menu.hover[id]; return; }
    const it = menuItemAt(h.cursor);
    const hv = menu.hover[id];
    if (!it) { delete menu.hover[id]; return; }
    menu.touched = now;
    if (!hv || hv.it !== it) { menu.hover[id] = { it, since: now }; return; }
    if (hv.done) return;                  // already chosen: move off it and back to choose again
    if (now - hv.since >= settings.holdTime) { hv.done = true; chooseItem(it); menu.hover[id] = { it, since: now, done: true }; }
  });
  if (mouse.on) {
    const it = menuItemAt(mouse);
    if (it) menu.hover.mouse = { it, since: now, done: true };   // the mouse only highlights; it clicks to choose
    else delete menu.hover.mouse;
  }
}

function drawMenu() {
  if (!menu.open) return;
  const b = menu.box, now = seconds();

  // A string menu: a thin line from the menu to the string it belongs to
  if (menu.kind === 'string') {
    const m = mid(menu.s.a, menu.s.b);
    ctx.strokeStyle = COLORS.hands[0];
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(clamp(m.x, b.x + 20, b.x + b.w - 20), m.y < b.y ? b.y : b.y + b.h);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = COLORS.wall;
  roundRect(b.x, b.y, b.w, b.h, 14);
  ctx.fill();

  ctx.font = '600 13px "Bricolage Grotesque", "Air Accidentals", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = COLORS.dust;
  for (const t of menu.titles) ctx.fillText(t.text, t.x, t.y);

  ctx.font = '600 16px "Bricolage Grotesque", "Air Accidentals", sans-serif';
  ctx.textAlign = 'center';
  const hovered = new Map(Object.values(menu.hover).map(h => [h.it, h]));
  for (const it of menu.items) {
    const on = it.on && it.on(), hv = hovered.get(it);
    ctx.fillStyle = on ? COLORS.hands[0] : COLORS.room;
    roundRect(it.x, it.y, it.w, it.h, 10);
    if (!it.display) ctx.fill();      // a display item is just text, like the tempo
    if (hv) {
      ctx.strokeStyle = it.danger ? COLORS.hands[1] : COLORS.bone;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.fillStyle = on ? COLORS.room : it.danger ? COLORS.hands[1] : COLORS.bone;
    if (it.left) { ctx.textAlign = 'left'; ctx.fillText(it.label, it.x + 2, it.y + it.h / 2 + 6); ctx.textAlign = 'center'; }
    else ctx.fillText(it.label, it.x + it.w / 2, it.y + it.h / 2 + 6);

    // The dwell ring: fills up while a hand holds still over an option
    if (hv && !hv.done) {
      const k = clamp((now - hv.since) / settings.holdTime, 0, 1);
      ctx.strokeStyle = COLORS.hands[0];
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(it.x + it.w - 12, it.y + 12, 7, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2);
      ctx.stroke();
    }
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

addEventListener('resize', () => { if (menu.open) layoutMenu(); });

// ── 21. Hands on the top-bar buttons ─────────────────────────
// The canvas and the buttons share the same screen positions, so we can
// ask the page which element is under a hand's pinch point. If it's a
// button, it gets a ring, and a still pinch-and-release presses it.
// Hands are less exact than a mouse, so each button catches a hand a few
// pixels beyond its edges (buttonPad). Nearest button wins.
function buttonAt(p) {
  if ($('bar').classList.contains('hidden')) return null;
  let best = null, bd = Infinity;
  for (const b of document.querySelectorAll('#bar button')) {
    const r = b.getBoundingClientRect(), pad = settings.buttonPad;
    if (p.x < r.left - pad || p.x > r.right + pad || p.y < r.top - pad || p.y > r.bottom + pad) continue;
    const d = Math.hypot(p.x - (r.left + r.right) / 2, p.y - (r.top + r.bottom) / 2);
    if (d < bd) { bd = d; best = b; }
  }
  return best;
}

// Rings on hovered buttons, and the dwell press: hold a fingertip on a
// button for buttonDwell seconds and it's pressed. Move off and back to press again.
function updateButtonHover(now) {
  const hovered = new Set();
  slots.forEach(h => {
    if (!h) return;
    // While a menu is open, buttons are paused, but a finished hold is kept,
    // so a panel that closes under a resting fingertip doesn't pop back open.
    // A hold only resets once the fingertip moves off the button.
    if (menu.open) return;
    const b = !h.pinched && buttonAt(h.cursor);
    if (!b) { h.btnDwell = null; return; }
    hovered.add(b);
    if (!h.btnDwell || h.btnDwell.el !== b) h.btnDwell = { el: b, since: now, done: false };
    if (!h.btnDwell.done && now - h.btnDwell.since >= settings.holdTime) { h.btnDwell.done = true; b.click(); }
  });
  for (const b of document.querySelectorAll('#bar button')) b.classList.toggle('hand-hover', hovered.has(b));
}

// ── 22. Hold a fingertip on a middle dot to open its menu ────
// The same hold as the buttons: keep your fingertip on a string's middle
// dot for holdTime seconds, and a ring fills around the dot, then the menu
// opens. A sweeping, playing finger passes over the dot far too quickly to
// trigger it. Move off and back to open it again.
function updateDotHold(now) {
  slots.forEach((h, j) => {
    if (!h || menu.open) return;    // paused while a menu is open, keeping a finished hold (see updateButtonHover)
    const s = !h.pinched && !grabs['hand' + j] && nearestDot(h.cursor, settings.dotRadius);
    if (!s) { h.dotHold = null; return; }
    if (!h.dotHold || h.dotHold.s !== s) h.dotHold = { s, since: now, done: false };
    if (!h.dotHold.done && now - h.dotHold.since >= settings.holdTime) { h.dotHold.done = true; openMenu(s); }
  });
}

// How far along a hold on this string's dot is, from 0 to 1 (null if nobody is holding it)
function dotHoldProgress(s) {
  let best = null;
  for (const h of slots) {
    if (h && h.dotHold && h.dotHold.s === s && !h.dotHold.done) {
      const k = clamp((seconds() - h.dotHold.since) / settings.holdTime, 0, 1);
      best = Math.max(best || 0, k);
    }
  }
  return best;
}

// ── 23. Holding a note ───────────────────────────────────────
// How does the app tell a resting finger from a sweeping one? Speed and
// time. A fingertip that stays within holdNear pixels of a string, moving
// slower than holdSlow, for holdAfter seconds, is resting on it. A sweep
// crosses the string far faster than that, so it plucks instead.
//
// What a hold does depends on the instrument (its "hold" in INSTRUMENTS):
//   'sustain' (violin, organ, voices...): the note keeps sounding until you lift off
//   'roll' (drums, marimba, oud...): fast repeated hits, like a drumroll or tremolo
//   none (guitar, piano, bells...): nothing extra, the pluck rings out on its own
// Slide a held finger along the string and the note follows it.
// The middle dot is left out: resting there opens the menu instead.

// Called from checkPluck for every pointer and string. Returns true while
// this pointer is holding this string, so it doesn't pluck it too.
function checkHold(s, id, p, d, mem, now) {
  const u = alongOf(s, p);
  const H = s.holds[id];
  if (H) {
    if (Math.abs(d) > settings.holdLeave || u < 0.02 || u > 0.98) {
      endHold(s, id);
      // Lifting off isn't a pluck: count the side the finger left by as where it came from
      mem.side = Math.sign(d) || mem.side;
      mem.last = now;
      return false;
    }
    H.seen = now;
    H.u = clamp(u, 0, 0.999);
    const z = zoneAt(s, H.u);
    if (z !== H.z) moveHold(s, H, z);
    return true;
  }

  const style = INSTRUMENTS[s.inst].hold;
  if (!style || s.pull) return false;
  const speed = dist(p, mem.at) / Math.max(now - mem.atTime, 0.008);
  const resting = Math.abs(d) < settings.holdNear && u > 0.06 && u < 0.94
    && dist(p, mid(s.a, s.b)) > settings.dotRadius + 4
    && speed < settings.holdSlow && now - s.born > NEW_STRING_QUIET;
  if (!resting) { delete s.dwell[id]; return false; }

  const dw = s.dwell[id];
  if (!dw || now - dw.last > 0.2) { s.dwell[id] = { since: now, last: now }; return false; }
  dw.last = now;
  if (now - dw.since < settings.holdAfter) return false;
  delete s.dwell[id];
  startHold(s, id, clamp(u, 0, 0.999), now);
  return true;
}

function startHold(s, id, u, now) {
  const H = s.holds[id] = { u, z: zoneAt(s, u), seen: now, voices: [], nextRoll: now };
  moveHold(s, H, H.z, true);
}

// Start (or switch to) the note for zone z
function moveHold(s, H, z, first) {
  H.z = z;
  const style = INSTRUMENTS[s.inst].hold;
  const info = zoneNotes(s, z);
  if (style === 'sustain') {
    for (const v of H.voices) v && v.release(0.12);
    H.voices = info.notes.map(m => playNote(s.inst, m, 0.6, 0, true));
    endSustain(H.rec);                                   // the looper: close the last held note...
    H.rec = captureEvent({ inst: s.inst, notes: info.notes, vel: 0.6, held: true });   // ...and open this one
  } else if (first) H.nextRoll = 0;     // a roll's first hit lands straight away
  s.flashZone = z;
  s.wobbleAt = performance.now();
  s.wobble = 4;
  const at = { x: lerp(s.a.x, s.b.x, H.u), y: lerp(s.a.y, s.b.y, H.u) };
  pops.push({ ...at, text: info.label, t: performance.now() });
}

function endHold(s, id) {
  const H = s.holds[id];
  if (!H) return;
  for (const v of H.voices) v && v.release(INSTRUMENTS[s.inst].sound === 'ensemble' ? 0.5 : 0.25);
  endSustain(H.rec);
  delete s.holds[id];
}

// Runs every frame: play the next hit of each roll, and end holds whose finger has gone
function updateHolds(now) {
  for (const s of strings) {
    for (const id of Object.keys(s.holds)) {
      const H = s.holds[id];
      if (now - H.seen > 0.12 || menu.open) { endHold(s, id); continue; }
      if (INSTRUMENTS[s.inst].hold !== 'roll' || now < H.nextRoll) continue;
      // A roll: each hit a little softer or louder than the last, like real hands
      const info = zoneNotes(s, H.z), vel = 0.35 + 0.25 * Math.random();
      if (info.drum) playDrum(s.inst, info.drum, vel, 0);
      else info.notes.forEach(m => playNote(s.inst, m, vel * (info.notes.length > 1 ? 0.6 : 1), 0));
      captureEvent(info.drum ? { inst: s.inst, drum: info.drum, vel } : { inst: s.inst, notes: info.notes, vel });
      s.wobble = 3 + 4 * vel;
      s.wobbleAt = performance.now();
      s.wobbleU = clamp(H.u, 0.1, 0.9);
      H.nextRoll = Math.max(H.nextRoll + settings.rollGap, now + settings.rollGap * 0.5);
    }
  }
}

// ── 24. Bend and snap ────────────────────────────────────────
// Pinch a string anywhere along it (away from the pegs and the middle dot)
// and pull sideways. The string bends toward your hand and the note rises,
// up to bendMax cents at bendPull pixels. Let go and it snaps back with a
// twang: the further you pulled, the louder.
//
// A bend changes the "detune" of every sound source in the note at once.
// Detune is in cents, so +100 raises the note by exactly one semitone.

function nearestBody(p, radius) {
  let best = null, bd = radius;
  for (const s of strings) {
    const u = alongOf(s, p), d = Math.abs(sideOf(s, p));
    if (u < 0.08 || u > 0.92 || d >= bd) continue;
    if (dist(p, mid(s.a, s.b)) < settings.dotRadius) continue;   // that's the dot
    bd = d; best = { s, u };
  }
  return best;
}

function startBend(s, u) {
  for (const id in s.holds) endHold(s, id);
  const info = zoneNotes(s, zoneAt(s, u));
  s.pull = { u, d: 0 };
  if (info.drum) return { voices: [] };
  const held = INSTRUMENTS[s.inst].hold === 'sustain';
  const voices = info.notes.map(m => playNote(s.inst, m, 0.5, 0, held));
  pops.push({ x: lerp(s.a.x, s.b.x, u), y: lerp(s.a.y, s.b.y, u), text: info.label, t: performance.now() });
  return { voices };
}

function moveBend(g, p) {
  if (!strings.includes(g.s)) return;
  const d = clamp(sideOf(g.s, p), -settings.bendPull, settings.bendPull);
  g.s.pull = { u: g.u, d };
  const cents = settings.bendMax * Math.abs(d) / settings.bendPull;
  for (const v of g.voices) v && v.bend(cents);
}

function endBend(g) {
  const s = g.s, pulled = s.pull ? Math.abs(s.pull.d) : 0, side = s.pull && s.pull.d < 0 ? -1 : 1;
  s.pull = null;
  for (const v of g.voices) {
    if (!v) continue;
    v.bend(0, 0.012);                                         // snap back to pitch
    if (INSTRUMENTS[s.inst].hold === 'sustain') v.release(0.3);
  }
  if (!strings.includes(s)) return;
  // The twang: a fresh pluck where you let go, louder the further you pulled
  if (pulled > 20) pluck(s, g.u, clamp(0.3 + 0.7 * pulled / settings.bendPull, 0.3, 1), side);
}

// ── 25. The air pad ──────────────────────────────────────────
// Pinch empty air with one hand and drag. One drag, three effects, one per
// direction away from where you pinched:
//   down     darker: a lowpass filter closes, cutting the high sounds
//   up       thinner: a highpass filter opens, cutting the low sounds
//   sideways echo: more of the mix is fed into a repeating delay
// The two directions of a drag are measured separately (how far down or
// up, and how far sideways), so a diagonal drag mixes two effects at once.
// Let go and everything glides back to normal.
//
// The effects sit on the whole mix, between the master volume and the limiter:
//
//   master ──► thin (highpass) ──► dark (lowpass) ──► limiter ──► speakers
//      └──► echo send ──► delay ◄─► feedback (softened each repeat) ──┘ (into thin)
let pad = null;          // the effect nodes
let padState = null;     // { from, to, dark, thin, echo } while the pad is in use

function buildAirPad(from, to) {
  const thin = filterNode('highpass', 20, 0.7);
  const dark = filterNode('lowpass', 20000, 0.7);
  from.connect(thin);
  thin.connect(dark);
  dark.connect(to);

  // The echo: a delay whose output feeds back into itself, a little softer
  // and darker each time round, so each repeat fades like a real echo
  const send = gainNode(0);
  const delay = audio.createDelay(2);
  delay.delayTime.value = 0.375;
  const feedback = gainNode(0.4);
  const soften = filterNode('lowpass', 3000, 0.5);
  from.connect(send);
  send.connect(delay);
  delay.connect(soften);
  soften.connect(feedback);
  feedback.connect(delay);
  soften.connect(thin);
  pad = { thin, dark, send, feedback, delay };
}

function moveAirPad(from, to) {
  const down = to.y - from.y, side = Math.abs(to.x - from.x), R = settings.padReach;
  // A small dead zone around the start, so a tiny wobble changes nothing
  const dark = clamp((down - 20) / R, 0, 1);
  const thin = clamp((-down - 20) / R, 0, 1);
  const echo = clamp((side - 30) / R, 0, 1);
  padState = { from: { ...from }, to: { ...to }, dark, thin, echo };
  setAirPad(dark, thin, echo, 0.04);
}

function endAirPad() {
  if (!padState) return;
  padState = null;
  setAirPad(0, 0, 0, 0.12);     // glide back to normal
}

// Filters are set in a curve, not a straight line, because our ears hear
// pitch that way: each halving of the cutoff sounds like the same-sized step.
function setAirPad(dark, thin, echo, glide) {
  if (!pad) return;
  const t = audio.currentTime;
  pad.dark.frequency.setTargetAtTime(20000 * Math.pow(0.018, dark), t, glide);   // 20 kHz down to 360 Hz
  pad.thin.frequency.setTargetAtTime(20 * Math.pow(60, thin), t, glide);         // 20 Hz up to 1,200 Hz
  pad.send.gain.setTargetAtTime(echo * 0.7, t, glide);
  pad.feedback.gain.setTargetAtTime(0.35 + 0.25 * echo, t, glide);
}

// The pad on screen: a cross at the pinch, labelled, with a line to where you are now
function drawAirPad() {
  if (!padState) return;
  const { from, to, dark, thin, echo } = padState, R = settings.padReach + 30;
  ctx.strokeStyle = COLORS.dust;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 8]);
  ctx.beginPath();
  ctx.moveTo(from.x - R, from.y); ctx.lineTo(from.x + R, from.y);
  ctx.moveTo(from.x, from.y - R); ctx.lineTo(from.x, from.y + R);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  // Direction names at the ends of the cross, lit when that effect is on
  ctx.font = '600 14px "Bricolage Grotesque", "Air Accidentals", sans-serif';
  ctx.textAlign = 'center';
  const label = (text, x, y, on) => { ctx.fillStyle = on ? COLORS.hands[0] : COLORS.dust; ctx.fillText(text, x, y); };
  label('Thinner', from.x, from.y - R - 10, thin > 0);
  label('Darker', from.x, from.y + R + 22, dark > 0);
  label('Echo', from.x - R - 40, from.y + 5, echo > 0 && to.x < from.x);
  label('Echo', from.x + R + 40, from.y + 5, echo > 0 && to.x >= from.x);

  // The live amounts, beside the starting point: the one place your hand never covers
  const amounts = [['Darker', dark], ['Thinner', thin], ['Echo', echo]].filter(([, k]) => k > 0);
  ctx.textAlign = to.x >= from.x ? 'right' : 'left';
  const tx = from.x + (to.x >= from.x ? -14 : 14);
  ctx.fillStyle = COLORS.hands[0];
  amounts.forEach(([name, k], i) => ctx.fillText(`${name} ${Math.round(k * 100)}%`, tx, from.y + (to.y >= from.y ? -14 - i * 18 : 26 + i * 18)));

  ctx.strokeStyle = COLORS.hands[0];
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.lineTo(to.x, to.y);
  ctx.stroke();
  ctx.fillStyle = COLORS.hands[0];
  dot(from, 5);
}

// ── 26. Beats ────────────────────────────────────────────────
// A backing beat: a pattern of 16 steps per bar (each step a sixteenth
// note), looping. Five parts, switched on one at a time.
//
// In a pattern line, each character is one step:
//   x = hit, X = accented hit (louder), o = open hi-hat, - = rest
//   bass: 0 = the chord's root note, 3 = its third, 5 = its fifth, 8 = the root an octave up
// A part can have two lines: they take turns, one bar each.
//
// Bass and chords follow a chord progression, one chord per bar, built from
// the top bar's key and scale. So whatever you play on the strings fits.
const BEATS = {
  boombap: { name: 'Boom bap', bpm: 90, swing: 0.12, chords: 'epiano', bass: 'bass',
    kick: ['X-----x---x-----', 'X-----x-x-----x-'], snare: ['----X-------X---'], hats: ['x-x-x-x-x-x-x-x-'],
    bassLine: ['0-----0---5-----', '0-----0-8---5---'], stabs: ['x---------x-----'] },
  house: { name: 'House', bpm: 122, swing: 0, chords: 'organ', bass: 'synth',
    kick: ['X---X---X---X---'], snare: ['----x-------x---'], hats: ['x-o-x-o-x-o-x-o-'],
    bassLine: ['--0---0---0---0-', '--0---0---5---8-'], stabs: ['--x--x----x--x--'] },
  lofi: { name: 'Lo-fi', bpm: 78, swing: 0.16, chords: 'epiano', bass: 'bass',
    kick: ['X------x--X-----', 'X-------x-X-----'], snare: ['----X-------X---'], hats: ['x-x-x-x-x-x-x-xx'],
    bassLine: ['0-------3-----5-'], stabs: ['x-------x-------'] },
  trap: { name: 'Trap', bpm: 140, swing: 0, chords: 'bells', bass: 'bass808',
    kick: ['X-----X---X--x--', 'X-----X-------x-'], snare: ['--------X-------'], hats: ['xxxxxxxxxxxxxxxx', 'xxxxxxxxxxxxx-xx'],
    bassLine: ['0-----0---0-----', '0-----5-------8-'], stabs: ['x---------------'] },
  dembow: { name: 'Reggaeton', bpm: 96, swing: 0, chords: 'synth', bass: 'bass',
    kick: ['X---X---X---X---'], snare: ['---x--x----x--x-'], hats: ['x-x-x-x-x-x-x-x-'],
    bassLine: ['0-------0---5---'], stabs: ['x-----x---x-----'] },
  maqsum: { name: 'Maqsum', bpm: 100, swing: 0, chords: 'qanun', bass: 'bass', kit: 'handdrums',
    // Maqsum on a darbuka: doum, tek, (rest), tek, doum, (rest), tek, (rest)
    kick: ['X-------X-------'], snare: ['--X---X-----X---'], hats: ['x-x-x-x-x-x-x-x-'],
    bassLine: ['0-------0---5---'], stabs: ['x-------x-------'] },
};
const BEAT_ORDER = Object.keys(BEATS);
const PARTS = [['kick', 'Kick'], ['snare', 'Snare'], ['hats', 'Hats'], ['bass', 'Bass'], ['chords', 'Chords']];

// Which drum sound each part uses, for the regular kit and the hand-drum kit
const KIT_SOUNDS = {
  drums:     { kick: 'Kick', snare: 'Snare', hat: 'Closed hat', open: 'Open hat' },
  handdrums: { kick: 'Doum', snare: 'Tek',   hat: 'Ka',         open: 'Slap' },
};
// A chord progression for each scale, as scale steps (0 = the key's own chord)
const PROGRESSIONS = { major: [0, 4, 5, 3], minor: [0, 5, 2, 6], dorian: [0, 3, 0, 6], hijaz: [0, 1, 0, 6] };
const BEAT_LEVEL = 0.8;            // the beat sits a little under what you play


// How long one step lasts: a beat is 60/bpm seconds, and a step is a quarter of a beat
const stepLength = () => 60 / beat.bpm / 4;

// ── The look-ahead scheduler ──
// Browser timers (setInterval) are unreliable: when the page is busy drawing
// or tracking hands, a timer can fire tens of milliseconds late. Notes
// played straight from a timer would wobble.
//
// The audio clock never wobbles. So the timer only plans ahead: every 25 ms
// it books every step due in the next LOOKAHEAD seconds, each at its exact
// time on the audio clock. Even if a timer fires late, the notes it books
// were already booked by an earlier one, with time to spare.
const LOOKAHEAD = 0.12;    // seconds booked ahead
const TICK = 25;           // milliseconds between planning runs

function startBeat() {
  startAudio();
  if (beat.playing) return;
  if (!Object.values(beat.parts).some(Boolean)) beat.parts.kick = true;   // never start silent
  beat.playing = true;
  beat.step = 0;
  beat.nextTime = audio.currentTime + 0.06;
  beat.booked = [];
  for (const L of layers) { L.offset = 0; L.ready = true; }   // recorded loops restart from their beginning
  beat.timer = setInterval(planAhead, TICK);
  planAhead();
  beat.dirty = true;
}
function stopBeat() {
  if (rec.armed || rec.on) cancelRecording();
  beat.playing = false;
  clearInterval(beat.timer);
  beat.dirty = true;
}

function planAhead() {
  if (!beat.playing) return;
  while (beat.nextTime < audio.currentTime + LOOKAHEAD) {
    loopBoundary(beat.step, beat.nextTime);       // the looper starts and stops recording on bar lines
    playStep(beat.step, beat.nextTime);
    playLayers(beat.step, beat.nextTime);
    beat.booked.push({ i: beat.step % 16, s: beat.step, t: beat.nextTime });
    if (beat.booked.length > 32) beat.booked.shift();
    beat.step++;
    beat.nextTime += stepLength();
  }
}

// Swing: every second sixteenth is pushed a little late, which gives a
// laid-back, human groove instead of a stiff, machine one.
function swungTime(step, t) {
  const B = BEATS[beat.pattern];
  return step % 2 === 1 ? t + B.swing * stepLength() : t;
}

function playStep(step, t) {
  const B = BEATS[beat.pattern], bar = Math.floor(step / 16), i = step % 16;
  const at = swungTime(i, t);
  const line = lines => lines[bar % lines.length][i];
  const kit = B.kit || 'drums', K = KIT_SOUNDS[kit];
  const vel = ch => (ch === 'X' ? 0.95 : 0.65) * BEAT_LEVEL;

  if (beat.parts.kick)  { const c = line(B.kick);  if (c !== '-') playDrum(kit, K.kick, vel(c), at); }
  if (beat.parts.snare) { const c = line(B.snare); if (c !== '-') playDrum(kit, K.snare, vel(c), at); }
  if (beat.parts.hats)  { const c = line(B.hats);  if (c !== '-') playDrum(kit, c === 'o' ? K.open : K.hat, (i % 4 === 0 ? 0.6 : 0.4) * BEAT_LEVEL, at); }

  const chord = chordForBar(bar);
  if (beat.parts.bass) {
    const c = line(B.bassLine);
    if (c !== '-') {
      const offset = { 0: 0, 3: 2, 5: 4, 8: 7 }[c] || 0;          // scale steps up from the chord's root
      playNote(B.bass, beatNote(chord + offset) - 12, 0.75 * BEAT_LEVEL, at);
    }
  }
  if (beat.parts.chords && line(B.stabs) !== '-') {
    [0, 2, 4].forEach((k, n) => playNote(B.chords, beatNote(chord + k), 0.45 * BEAT_LEVEL, at + n * 0.006));
  }
}

// This bar's chord, as a scale step. The progression loops every 4 bars.
function chordForBar(bar) {
  const parent = SCALES[music.scale].parent || music.scale;
  const prog = PROGRESSIONS[parent] || PROGRESSIONS.major;
  return prog[bar % prog.length];
}
// A scale step as a MIDI note, in the top bar's key and the parent scale
function beatNote(d) {
  const parent = SCALES[music.scale].parent || music.scale;
  return degree({ key: music.key, oct: 0 }, parent, d);
}

// Where the beat is right now, as a step from 0 to 15 (or -1 when stopped)
// (The latest booked step whose time has come. Reading the bookings, not
// working it out from the tempo, keeps the lights right when the tempo changes.)
function currentStep() {
  if (!beat.playing || !audio) return -1;
  let cur = -1;
  for (const b of beat.booked) if (b.t <= audio.currentTime) cur = b.i;
  return cur;
}

// The beat lights and the looper status sit in the top left. On a narrow
// window the top bar reaches that far, so they move down below it.
function statusDrop() {
  const first = document.querySelector('#bar button');
  if (!first) return 0;
  const r = first.getBoundingClientRect();
  return r.left < 330 ? r.bottom + 4 : 0;     // 330 px: the width of the lights and their caption
}

// 16 lights in the top left: the current step glows, and every fourth light is bigger (the beats)
function drawBeatLights() {
  if (!beat.playing) return;
  const cur = currentStep();
  for (let i = 0; i < 16; i++) {
    ctx.fillStyle = i === cur ? COLORS.hands[0] : COLORS.dust;
    ctx.globalAlpha = i === cur ? 1 : 0.35;
    dot({ x: 24 + i * 16 + Math.floor(i / 4) * 6, y: 34 + statusDrop() }, i % 4 === 0 ? 5 : 3.5);
  }
  ctx.globalAlpha = 1;
  ctx.font = '600 13px "Bricolage Grotesque", "Air Accidentals", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = COLORS.dust;
  ctx.fillText(`${BEATS[beat.pattern].name} at ${beat.bpm} BPM`, 24, 60 + statusDrop());
}

// The beat panel: pattern, parts, tempo, play/stop
function buildBeatRows(rows) {
  rows.push({ title: 'Pattern', items: BEAT_ORDER.map(id => ({
    label: BEATS[id].name, w: 100, on: () => beat.pattern === id,
    act: () => { beat.pattern = id; beat.bpm = BEATS[id].bpm; },
  })) });
  rows.push({ title: 'Parts: switch on one at a time', items: PARTS.map(([id, label]) => ({
    label, w: 84, on: () => beat.parts[id],
    act: () => { beat.parts[id] = !beat.parts[id]; if (beat.parts[id] && !beat.playing) startBeat(); },
  })) });
  rows.push({ title: 'Tempo', items: [
    { label: '−10', w: 56, act: () => { beat.bpm = clamp(beat.bpm - 10, 50, 180); } },
    { label: '−1', w: 48, act: () => { beat.bpm = clamp(beat.bpm - 1, 50, 180); } },
    { label: `${beat.bpm} BPM`, w: 90, display: true, act: () => {} },
    { label: '+1', w: 48, act: () => { beat.bpm = clamp(beat.bpm + 1, 50, 180); } },
    { label: '+10', w: 56, act: () => { beat.bpm = clamp(beat.bpm + 10, 50, 180); } },
  ] });
  rows.push({ title: '', items: [
    { label: beat.playing ? 'Stop' : 'Play', w: 100, on: () => beat.playing, act: () => { beat.playing ? stopBeat() : startBeat(); } },
    { gap: 24 },
    { label: 'Done', w: 100, act: () => { closeMenu(); } },
  ] });
}

$('beatBtn').addEventListener('click', () => togglePanel('beat', $('beatBtn')));
// With a keyboard: the space bar starts and stops the beat
addEventListener('keydown', e => {
  if (e.code !== 'Space' || !started || e.target.tagName === 'INPUT') return;
  e.preventDefault();
  beat.playing ? stopBeat() : startBeat();
});

// ── 27. The looper ───────────────────────────────────────────
// Records what you play over the beat, then plays it back on every loop, so
// you can stack layers.
//
// What a loop needs to remember about each sound ("event"):
//   inst    which instrument
//   notes   which notes (or drum: which drum)
//   vel     how loud
//   pos     where in the loop, counted in beat steps (sixteenths), not
//           seconds. That way a layer stays in time if you change tempo.
//   dur     for a held note: how many steps it lasted
//
// Recording always starts and stops exactly on a bar line, so layers line
// up with the beat and with each other. Arm it, and it waits for the next bar.
//
// Snap: each sound's position is rounded to the nearest step, which tidies
// up timing. Off, it keeps your exact timing, swing and all.
const MAX_LAYERS = 6;
const loopStats = { replayed: 0 };   // for testing: how many sounds the layers have replayed

function armRecording() {
  if (layers.length >= MAX_LAYERS) { toast(`${MAX_LAYERS} layers is the limit. Delete one first.`); return; }
  if (!beat.playing) startBeat();           // a loop needs a steady clock
  Object.assign(rec, { armed: true, on: false, events: [] });
  beat.dirty = true;
}
function cancelRecording() {
  Object.assign(rec, { armed: false, on: false, events: [] });
  beat.dirty = true;
}

// Called by the scheduler for every step it books, before it plays the step
function loopBoundary(step, t) {
  if (rec.armed && step % 16 === 0) {
    Object.assign(rec, { armed: false, on: true, start: step, startTime: t, events: [] });
    beat.dirty = true;
  } else if (rec.on && step === rec.start + rec.len) finishRecording(t);
}

// Note down one sound. Returns the event, so a held note can be given its length later.
function captureEvent(ev) {
  if (!rec.on || !audio) return null;
  const t = audio.currentTime;
  let pos = (t - rec.startTime) / stepLength();
  if (pos < -0.5 || pos >= rec.len) return null;          // before the bar line, or after the end
  if (rec.snap) pos = Math.round(pos) % rec.len;
  ev.pos = Math.max(0, pos);
  if (ev.held) ev.t0 = t;
  rec.events.push(ev);
  return ev;
}
// A held note has ended: record how long it lasted, in steps
function endSustain(ev) {
  if (!ev || ev.dur !== undefined || !audio) return;
  let dur = (audio.currentTime - ev.t0) / stepLength();
  if (rec.snap) dur = Math.max(1, Math.round(dur));
  ev.dur = Math.min(dur, rec.len - ev.pos);
}

function finishRecording(t) {
  for (const ev of rec.events) if (ev.held && ev.dur === undefined) ev.dur = Math.max(1, rec.len - ev.pos);   // still held at the end
  if (rec.events.length) {
    // File each event under its step, so playback only looks at one step's sounds at a time
    const buckets = Array.from({ length: rec.len }, () => []);
    for (const ev of rec.events) buckets[Math.floor(ev.pos)].push(ev);
    const names = [...new Set(rec.events.map(e => INSTRUMENTS[e.inst].name))];
    layers.push({ id: Date.now(), len: rec.len, offset: rec.start, buckets, ready: false, muted: false,
                  name: names.slice(0, 3).join(', ') + (names.length > 3 ? '…' : ''), count: rec.events.length });
    toast(`Layer ${layers.length} recorded`);
    beat.dirty = true;
  } else toast('Nothing was played, so no layer was made');
  Object.assign(rec, { armed: false, on: false, events: [] });
  beat.dirty = true;
  if (menu.open && menu.kind === 'loop') layoutMenu();
}

// Called by the scheduler for every step: play each layer's sounds for this step.
// A brand-new layer skips its first time round, because you just played it live.
function playLayers(step, t) {
  for (const L of layers) {
    if (!L.ready) { if (step >= L.offset + L.len) L.ready = true; else continue; }
    if (L.muted) continue;
    const p = (((step - L.offset) % L.len) + L.len) % L.len;
    for (const ev of L.buckets[p]) {
      loopStats.replayed++;
      const at = swungTime(p % 16, t) + (ev.pos - p) * stepLength();
      if (ev.drum) playDrum(ev.inst, ev.drum, ev.vel, at);
      else if (ev.held) {
        const end = at + ev.dur * stepLength();
        for (const m of ev.notes) { const v = playNote(ev.inst, m, ev.vel, at, true); v && v.releaseAt(end, 0.2); }
      } else ev.notes.forEach((m, i) => playNote(ev.inst, m, ev.vel * (ev.notes.length > 1 ? 0.6 : 1), at + i * STRUM_GAP));
    }
  }
}

// ── 27a. Follow chords ──
// The beat changes chord every bar. With "follow chords" on, every string
// is retuned to the chord of the moment: each zone plays one of that
// chord's notes (root, third, fifth, then up an octave and round again).
// In chords mode, each zone plays the whole chord, a little higher each zone.
// So anywhere you sweep fits what the beat is doing.
function currentBar() {
  let bar = 0;
  for (const b of beat.booked) if (audio && b.t <= audio.currentTime) bar = Math.floor(b.s / 16);
  return bar;
}
function followNotes(s, z) {
  const parent = SCALES[music.scale].parent || music.scale;
  const root = chordForBar(currentBar());
  const tone = k => degree({ key: music.key, oct: s.oct }, parent, root + [0, 2, 4][k % 3] + 7 * Math.floor(k / 3));
  if (s.mode === 'chords') {
    const notes = [z, z + 1, z + 2].map(tone);
    return { notes, label: chordName([tone(0), tone(1), tone(2)]) };
  }
  const m = tone(z);
  return { notes: [m], label: noteName(m) };
}

// ── 27b. The loop panel and status ──
function buildLoopRows(rows) {
  const LEN = [[16, '1 bar'], [32, '2 bars'], [64, '4 bars']];
  rows.push({ title: 'Loop length', items: [
    ...LEN.map(([n, label]) => ({ label, w: 84, on: () => rec.len === n, act: () => { if (!rec.on) rec.len = n; } })),
    { gap: 16 },
    { label: rec.snap ? 'Snap: on' : 'Snap: off', w: 104, on: () => rec.snap, act: () => { rec.snap = !rec.snap; } },
    { label: music.follow ? 'Follow chords: on' : 'Follow chords: off', w: 170, on: () => music.follow, act: () => { music.follow = !music.follow; } },
  ] });
  rows.push({ title: '', items: [
    { label: rec.on ? 'Recording…' : rec.armed ? 'Get ready…' : 'Record layer', w: 150, danger: !rec.on && !rec.armed, on: () => rec.on || rec.armed,
      // Arming closes the panel: strings don't play while a menu is open, and your hands are needed
      act: () => { if (rec.on || rec.armed) cancelRecording(); else { armRecording(); closeMenu(); } } },
    { label: 'Undo last', w: 110, act: () => { layers.pop(); beat.dirty = true; } },
    { gap: 16 },
    { label: 'Done', w: 100, act: () => { closeMenu(); } },
  ] });
  layers.forEach((L, i) => rows.push({ title: i === 0 ? 'Layers' : '', tight: true, items: [
    { label: `${i + 1}. ${L.name}`, w: 260, display: true, left: true, act: () => {} },
    { label: L.muted ? 'Unmute' : 'Mute', w: 90, on: () => L.muted, act: () => { L.muted = !L.muted; } },
    { label: 'Delete', w: 90, danger: true, act: () => { layers.splice(layers.indexOf(L), 1); beat.dirty = true; } },
  ] }));
}

// Under the beat lights: what the looper is doing
function drawLoopStatus() {
  const lines = [];
  if (rec.armed) lines.push(['Get ready: recording starts at the next bar', COLORS.hands[0]]);
  if (rec.on && audio) {
    const done = clamp(Math.floor((audio.currentTime - rec.startTime) / stepLength()), 0, rec.len);
    lines.push([`Recording: ${Math.ceil((rec.len - done) / 4)} beats left`, COLORS.hands[1]]);
  }
  if (layers.length) lines.push([`${layers.length} layer${layers.length > 1 ? 's' : ''} looping`, COLORS.dust]);
  if (music.follow && beat.playing) {
    const parent = SCALES[music.scale].parent || music.scale, root = chordForBar(currentBar());
    lines.push([`Following ${chordName([0, 2, 4].map(k => degree({ key: music.key, oct: 0 }, parent, root + k)))}`, COLORS.dust]);
  }
  ctx.font = '600 13px "Bricolage Grotesque", "Air Accidentals", sans-serif';
  ctx.textAlign = 'left';
  const drop = statusDrop();
  lines.forEach(([text, color], i) => {
    ctx.fillStyle = color;
    if (color === COLORS.hands[1]) dot({ x: 29, y: 80 + drop + i * 18 }, 5);    // a red recording light
    ctx.fillText(text, color === COLORS.hands[1] ? 40 : 24, 84 + drop + i * 18);
  });
}

$('loopBtn').addEventListener('click', () => togglePanel('loop', $('loopBtn')));
// The Rec button: one press arms a recording (it starts on the next bar),
// another press while waiting or recording cancels it
$('recBtn').addEventListener('click', () => {
  if (rec.on || rec.armed) cancelRecording(); else armRecording();
  if (menu.open && menu.kind === 'loop') layoutMenu();
});

// For automated testing only: lets a test drive the app without a camera.
window.airStrings = { loopStats, rec, layers, armRecording, cancelRecording, followNotes, currentBar, beat, BEATS, startBeat, stopBeat, currentStep, pad: () => ({ pad, padState }), updateHolds, nearestBody, INSTRUMENTS, DRUM_KITS, playNote, playDrum, updateDotHold, openPanel, targetAt, updateMenu, updateButtonHover, menu, openMenu, closeMenu, menuItemAt, pinchStart, pinchEnd, stringNote, STRING_SOUND, Smoother, assignHands, updateGrabs, plucking, music, zoneCount, zoneAt, zoneNotes, lowEnd, pluck, slots, settings, strings, grabs, mouse, checkPluck, addString, sound: () => ({ audio, master, limiter }), get preview() { return preview; } };

loop();
</script>
